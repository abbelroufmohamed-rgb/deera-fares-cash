    </div>
  );
}

/* ============ التحليل الشامل للكاش في الخزينة ============ */
function balanceAsOf(treasury, txs, date) {
  let bal = Number(treasury.openingBalance) || 0;
  txs.forEach((t) => {
    if (t.treasuryId !== treasury.id || t.date > date) return;
    const amt = Number(t.amount) || 0;
    if (t.type === "deposit" || t.type === "transfer_in" || t.type === "custody_settle") bal += amt;
    else if (t.type === "expense" || t.type === "transfer_out" || t.type === "custody_out") bal -= amt;
  });
  return bal;
}

function BarRow({ label, value, max, color }) {
  const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 3 }}>
        <span style={{ color: C.text, fontWeight: 600 }}>{label}</span>
        <span style={{ color: C.navy, fontWeight: 700 }}>{fmt(value)}</span>
      </div>
      <div style={{ background: "#eef2f8", borderRadius: 6, height: 10, overflow: "hidden" }}>
        <div style={{ width: pct + "%", height: "100%", background: color, borderRadius: 6 }} />
      </div>
    </div>
  );
}

/* ============ محرك التحليل الذكي التلقائي للخزينة (إحصائي، يعمل محليًا بدون أي API خارجي) ============ */
function TreasurySmartInsights({ kpi, expenseByCategory, dailyTrend, byTreasuryCompare, custodySummary, relevantCounts, treasuryId }) {
  const items = useMemo(() => {
    const list = [];

    // 1) صافي التدفق النقدي العام
    if (kpi.netFlow < 0) {
      list.push({ kind: "warning", text: `صافي التدفق النقدي سالب (${fmt(kpi.netFlow)} ر.س) في هذه الفترة — المصروفات والسحوبات أكبر من الإيداعات، يستحق المتابعة.` });
    } else if (kpi.netFlow > 0) {
      list.push({ kind: "success", text: `صافي التدفق النقدي موجب (${fmt(kpi.netFlow)} ر.س) — الإيداعات أكبر من المصروفات في هذه الفترة.` });
    }

    // 2) فئة المصروفات المهيمنة (لو فئة واحدة بتاخد نسبة كبيرة جدًا من إجمالي المصروف)
    const totalExpense = expenseByCategory.reduce((s, c) => s + c.value, 0);
    if (totalExpense > 0 && expenseByCategory.length > 0) {
      const top = expenseByCategory[0];
      const pct = (top.value / totalExpense) * 100;
      if (pct >= 50) {
        list.push({ kind: "info", text: `فئة "${top.label}" بتستحوذ على ${pct.toFixed(0)}% من إجمالي المصروفات (${fmt(top.value)} ر.س) — تركّز غير معتاد يستاهل مراجعة.` });
      }
    }
    const uncategorized = expenseByCategory.find((c) => c.label === "بدون تصنيف");
    if (uncategorized && totalExpense > 0 && (uncategorized.value / totalExpense) > 0.3) {
      list.push({ kind: "warning", text: `${((uncategorized.value / totalExpense) * 100).toFixed(0)}% من المصروفات "بدون تصنيف" (${fmt(uncategorized.value)} ر.س) — تصنيفها هيحسّن دقة أي تحليل مستقبلي.` });
    }

    // 3) رصد يوم شاذ في الاتجاه اليومي (صرف يوم واحد أعلى بكتير من المتوسط)
    if (dailyTrend.length >= 4) {
      const outAmounts = dailyTrend.map((d) => d.out);
      const mean = outAmounts.reduce((s, v) => s + v, 0) / outAmounts.length;
      const variance = outAmounts.reduce((s, v) => s + Math.pow(v - mean, 2), 0) / outAmounts.length;
      const stddev = Math.sqrt(variance);
      const spikes = dailyTrend.filter((d) => stddev > 1 && d.out - mean > 1.5 * stddev && d.out > 0);
      spikes.slice(0, 2).forEach((s) => {
        list.push({ kind: "warning", text: `يوم ${s.date} فيه صرف أعلى من المعتاد بشكل ملحوظ (${fmt(s.out)} ر.س مقابل متوسط ${fmt(mean)} ر.س) — يستاهل مراجعة تفاصيله.` });
      });
    }

    // 4) مقارنة الخزائن — خزينة برصيد سالب
    byTreasuryCompare.forEach((t) => {
      if (t.balance < 0) {
        list.push({ kind: "warning", text: `خزينة "${t.name}" رصيدها سالب (${fmt(t.balance)} ر.س) — محتاجة توريد عاجل.` });
      }
    });

    // 5) العهد/السلف القائمة زمنيًا كبيرة أو متعددة عند نفس الشخص
    custodySummary.forEach((c) => {
      if (c.remaining > 0 && c.count >= 3) {
        list.push({ kind: "info", text: `"${c.name}" عليه ${c.count} عهد/سلف متفرقة بإجمالي متبقي ${fmt(c.remaining)} ر.س — يفضّل تجميعها وتسويتها.` });
      }
    });
    const bigCustody = custodySummary.filter((c) => c.remaining > 1000).sort((a, b) => b.remaining - a.remaining)[0];
    if (bigCustody) {
      list.push({ kind: "warning", text: `أكبر عهدة/سلفة قائمة حاليًا عند "${bigCustody.name}" بمبلغ ${fmt(bigCustody.remaining)} ر.س.` });
    }

    // 6) فروق الجرد المتكررة (عجز متكرر في نفس الخزينة)
    const countsByTreasury = {};
    relevantCounts.forEach((c) => {
      if (!countsByTreasury[c.treasuryId]) countsByTreasury[c.treasuryId] = [];
      countsByTreasury[c.treasuryId].push(c);
    });
    Object.values(countsByTreasury).forEach((list2) => {
      const deficits = list2.filter((c) => c.difference < -1);
      if (deficits.length >= 2) {
        list.push({ kind: "warning", text: `فيه عجز متكرر في عمليات الجرد لنفس الخزينة (${deficits.length} مرات) — نمط يستاهل تدقيق.` });
      }
    });

    if (list.length === 0) {
      list.push({ kind: "success", text: "لا توجد ملاحظات شاذة تستدعي القلق في هذه الفترة — الأداء المالي مستقر بوجه عام." });
    }
    return list;
    // eslint-disable-next-line
  }, [kpi, expenseByCategory, dailyTrend, byTreasuryCompare, custodySummary, relevantCounts]);

  const KIND_STYLE = {
    warning: { bg: "#fef2f2", border: "#fecaca", icon: "⚠️", color: "#991b1b" },
    success: { bg: "#f0fdf4", border: "#bbf7d0", icon: "✅", color: "#166534" },
    info: { bg: "#eff6ff", border: "#bfdbfe", icon: "ℹ️", color: "#1e40af" },
  };

  return (
    <div style={{
      background: "linear-gradient(135deg,#faf5ff,#f5f3ff)", border: "1px solid #ddd6fe", borderRadius: 14,
      padding: 20, marginBottom: 18
    }}>
      <div style={{ fontWeight: 800, fontSize: 15, color: "#5b21b6", marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
        🤖 تحليل ذكي تلقائي للخزينة
      </div>
      <div style={{ fontSize: 11.5, color: "#7c3aed", marginBottom: 14 }}>تحليل إحصائي فوري لحركة الخزينة في هذه الفترة — يعمل محليًا داخل التطبيق بدون أي اتصال خارجي</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {items.map((it, i) => {
          const s = KIND_STYLE[it.kind];
          return (
            <div key={i} style={{
              background: s.bg, border: "1px solid " + s.border, borderRadius: 10, padding: "10px 13px",
              fontSize: 13, color: s.color, display: "flex", gap: 8, lineHeight: 1.6
            }}>
              <span>{s.icon}</span><span>{it.text}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TreasuryAnalysis({ treasuries, txs, custodies, cashCounts, institutionName }) {
  const [treasuryId, setTreasuryId] = useState("all");
  const [fromDate, setFromDate] = useState(firstDayOfMonth());
  const [toDate, setToDate] = useState(todayStr());

  const filteredTxs = useMemo(() => {
    return txs.filter((t) => {
      if (treasuryId !== "all" && t.treasuryId !== treasuryId) return false;
      return t.date >= fromDate && t.date <= toDate;
    });
  }, [txs, treasuryId, fromDate, toDate]);

  const kpi = useMemo(() => {
    const k = { deposit: 0, expense: 0, transferOut: 0, transferIn: 0, custodyOut: 0, custodySettle: 0 };
    filteredTxs.forEach((t) => {
      const amt = Number(t.amount) || 0;
      if (t.type === "deposit") k.deposit += amt;
      else if (t.type === "expense") k.expense += amt;
      else if (t.type === "transfer_out") k.transferOut += amt;
      else if (t.type === "transfer_in") k.transferIn += amt;
      else if (t.type === "custody_out") k.custodyOut += amt;
      else if (t.type === "custody_settle") k.custodySettle += amt;
    });
    const netFlow = k.deposit + k.transferIn + k.custodySettle - k.expense - k.transferOut - k.custodyOut;
    return { ...k, netFlow };
  }, [filteredTxs]);

  const endingBalance = useMemo(() => {
    if (treasuryId === "all") {
      return treasuries.reduce((s, t) => s + balanceAsOf(t, txs, toDate), 0);
    }
    const t = treasuries.find((x) => x.id === treasuryId);
    return t ? balanceAsOf(t, txs, toDate) : 0;
  }, [treasuries, txs, treasuryId, toDate]);

  const openingBalance = endingBalance - kpi.netFlow;

  const expenseByCategory = useMemo(() => {
    const map = {};
    filteredTxs.filter((t) => t.type === "expense").forEach((t) => {
      const cat = t.category || "بدون تصنيف";
      map[cat] = (map[cat] || 0) + (Number(t.amount) || 0);
    });
    return Object.entries(map).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
  }, [filteredTxs]);

  const depositByCategory = useMemo(() => {
    const map = {};
    filteredTxs.filter((t) => t.type === "deposit").forEach((t) => {
      const cat = t.category || "بدون تصنيف";
      map[cat] = (map[cat] || 0) + (Number(t.amount) || 0);
    });
    return Object.entries(map).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
  }, [filteredTxs]);

  const dailyTrend = useMemo(() => {
    const map = {};
    filteredTxs.forEach((t) => {
      const d = t.date;
      if (!map[d]) map[d] = { date: d, in: 0, out: 0 };
      const amt = Number(t.amount) || 0;
      if (t.type === "deposit" || t.type === "transfer_in" || t.type === "custody_settle") map[d].in += amt;
      else map[d].out += amt;
    });
    return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
  }, [filteredTxs]);

  const byTreasuryCompare = useMemo(() => {
    if (treasuryId !== "all") return [];
    return treasuries.map((t) => {
      const tTxs = filteredTxs.filter((x) => x.treasuryId === t.id);
      let inAmt = 0, outAmt = 0;
      tTxs.forEach((x) => {
        const amt = Number(x.amount) || 0;
        if (x.type === "deposit" || x.type === "transfer_in" || x.type === "custody_settle") inAmt += amt;
        else outAmt += amt;
      });
      return { name: t.name, inAmt, outAmt, net: inAmt - outAmt, balance: balanceAsOf(t, txs, toDate) };
    }).sort((a, b) => b.balance - a.balance);
  }, [treasuries, filteredTxs, txs, treasuryId, toDate]);

  const custodySummary = useMemo(() => {
    const inScope = custodies.filter((c) => (treasuryId === "all" || c.treasuryId === treasuryId) && c.date >= fromDate && c.date <= toDate);
    const map = {};
    inScope.forEach((c) => {
      const settled = (c.settlements || []).reduce((s, x) => s + (Number(x.cashReturned) || 0) + (Number(x.expensed) || 0), 0);
      const remaining = Math.max(0, (Number(c.amount) || 0) - settled);
      if (!map[c.employeeName]) map[c.employeeName] = { name: c.employeeName, total: 0, remaining: 0, count: 0 };
      map[c.employeeName].total += Number(c.amount) || 0;
      map[c.employeeName].remaining += remaining;
      map[c.employeeName].count += 1;
    });
    return Object.values(map).sort((a, b) => b.remaining - a.remaining);
  }, [custodies, treasuryId, fromDate, toDate]);

  const relevantCounts = useMemo(() => {
    return cashCounts
      .filter((c) => (treasuryId === "all" || c.treasuryId === treasuryId) && c.date >= fromDate && c.date <= toDate)
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 10);
  }, [cashCounts, treasuryId, fromDate, toDate]);

  function doPrint() { window.print(); }

  const scopeLabel = treasuryId === "all" ? "كل الخزائن" : (treasuries.find((t) => t.id === treasuryId)?.name || "");
  const maxExpenseCat = Math.max(1, ...expenseByCategory.map((c) => c.value));
  const maxDepositCat = Math.max(1, ...depositByCategory.map((c) => c.value));

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📈 تحليل شامل للكاش في الخزينة</div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <label style={smallLabel}>الخزينة</label>
            <select value={treasuryId} onChange={(e) => setTreasuryId(e.target.value)} style={inputStyle2}>
              <option value="all">كل الخزائن</option>
              {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div><label style={smallLabel}>من تاريخ</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
          <div><label style={smallLabel}>إلى تاريخ</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
          <div style={{ display: "flex", gap: 6 }}>
            {[["thisMonth", "الشهر الحالي"], ["lastMonth", "الشهر الماضي"], ["last7", "آخر 7 أيام"]].map(([k, l]) => (
              <button key={k} onClick={() => { const r = presetRange(k); setFromDate(r.from); setToDate(r.to); }} style={ghostBtn}>{l}</button>
            ))}
          </div>
          <div style={{ marginRight: "auto" }}><button onClick={doPrint} style={smallBtn}>🖨️ طباعة / حفظ PDF</button></div>
        </div>
      </div>

      <div className="print-area">
        <div className="print-only-header">
          <h2>{institutionName}</h2>
          <div>تحليل شامل للكاش — {scopeLabel} — من {fromDate} إلى {toDate}</div>
        </div>

        <TreasurySmartInsights
          kpi={kpi} expenseByCategory={expenseByCategory} dailyTrend={dailyTrend}
          byTreasuryCompare={byTreasuryCompare} custodySummary={custodySummary} relevantCounts={relevantCounts}
          treasuryId={treasuryId}
        />

        <div style={cardStyle}>
          <div style={cardTitle}>📌 المؤشرات الرئيسية — {scopeLabel}</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {[
              { label: "الرصيد الافتتاحي", val: openingBalance },
              { label: "إجمالي الإيداعات", val: kpi.deposit, highlight: true, positive: true },
              { label: "إجمالي المصروفات", val: kpi.expense, highlight: true, positive: false },
              { label: "إجمالي العهد الصادرة", val: kpi.custodyOut },
              { label: "إجمالي العهد المسددة (نقدي)", val: kpi.custodySettle },
              { label: "صافي التدفق النقدي", val: kpi.netFlow, highlight: true, big: true },
              { label: "الرصيد الختامي", val: endingBalance, big: true },
            ].map((it) => (
              <div key={it.label} style={{
                flex: "1 1 180px", background: it.big ? "linear-gradient(135deg,#0f2557,#1d4ed8)" : C.blueSoft,
                border: "1px solid " + (it.big ? "transparent" : C.border), borderRadius: 10, padding: "11px 13px"
              }}>
                <div style={{ fontSize: 12, color: it.big ? "#dbe6ff" : C.muted, marginBottom: 4 }}>{it.label}</div>
                <div style={{
                  fontSize: 18, fontWeight: 800,
                  color: it.big ? "#fff" : (it.highlight ? (it.positive === false ? C.danger : (it.positive === true ? C.success : (it.val < 0 ? C.danger : C.success))) : C.navy)
                }}>{fmt(it.val)}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
          <div style={{ ...cardStyle, flex: "1 1 380px" }}>
            <div style={cardTitle}>🧾 توزيع المصروفات حسب الفئة</div>
            {expenseByCategory.length === 0 ? (
              <div style={{ color: "#9ca3af", fontSize: 13 }}>لا يوجد مصروفات في هذه الفترة</div>
            ) : expenseByCategory.map((c) => (
              <BarRow key={c.label} label={c.label} value={c.value} max={maxExpenseCat} color={C.danger} />
            ))}
          </div>
          <div style={{ ...cardStyle, flex: "1 1 380px" }}>
            <div style={cardTitle}>💰 توزيع الإيداعات حسب الفئة</div>
            {depositByCategory.length === 0 ? (
              <div style={{ color: "#9ca3af", fontSize: 13 }}>لا يوجد إيداعات في هذه الفترة</div>
            ) : depositByCategory.map((c) => (
              <BarRow key={c.label} label={c.label} value={c.value} max={maxDepositCat} color={C.success} />
            ))}
          </div>
        </div>

        <div style={cardStyle}>
          <div style={cardTitle}>📅 الاتجاه اليومي للتدفق النقدي</div>
          <div style={{ overflowX: "auto" }}>
            <table style={tblStyle}>
              <thead><tr><th style={th}>التاريخ</th><th style={th}>وارد</th><th style={th}>صادر</th><th style={th}>صافي اليوم</th></tr></thead>
              <tbody>
                {dailyTrend.map((d) => (
                  <tr key={d.date}>
                    <td style={td}>{d.date}</td>
                    <td style={{ ...td, color: C.success }}>{fmt(d.in)}</td>
                    <td style={{ ...td, color: C.danger }}>{fmt(d.out)}</td>
                    <td style={{ ...td, fontWeight: 700, color: (d.in - d.out) < 0 ? C.danger : C.success }}>{fmt(d.in - d.out)}</td>
                  </tr>
                ))}
                {dailyTrend.length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد حركات</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        {treasuryId === "all" && (
          <div style={cardStyle}>
            <div style={cardTitle}>🏦 مقارنة بين الخزائن</div>
            <div style={{ overflowX: "auto" }}>
              <table style={tblStyle}>
                <thead><tr><th style={th}>الخزينة</th><th style={th}>إجمالي الوارد</th><th style={th}>إجمالي الصادر</th><th style={th}>صافي الفترة</th><th style={th}>الرصيد حتى {toDate}</th></tr></thead>
                <tbody>
                  {byTreasuryCompare.map((t) => (
                    <tr key={t.name}>
                      <td style={{ ...td, fontWeight: 700 }}>{t.name}</td>
                      <td style={{ ...td, color: C.success }}>{fmt(t.inAmt)}</td>
                      <td style={{ ...td, color: C.danger }}>{fmt(t.outAmt)}</td>
                      <td style={{ ...td, color: t.net < 0 ? C.danger : C.success }}>{fmt(t.net)}</td>
                      <td style={{ ...td, fontWeight: 800 }}>{fmt(t.balance)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        <div style={cardStyle}>
          <div style={cardTitle}>🧍 ملخّص عهد الموظفين خلال الفترة</div>
          <div style={{ overflowX: "auto" }}>
            <table style={tblStyle}>
              <thead><tr><th style={th}>الموظف</th><th style={th}>عدد العهد</th><th style={th}>إجمالي المصروف له</th><th style={th}>المتبقي القائم</th></tr></thead>
              <tbody>
                {custodySummary.map((c) => (
                  <tr key={c.name}>
                    <td style={td}>{c.name}</td>
                    <td style={td}>{c.count}</td>
                    <td style={td}>{fmt(c.total)}</td>
                    <td style={{ ...td, fontWeight: 700, color: c.remaining > 0 ? C.danger : C.success }}>{fmt(c.remaining)}</td>
                  </tr>
                ))}
                {custodySummary.length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد عهد في هذه الفترة</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        <div style={cardStyle}>
          <div style={cardTitle}>🧮 آخر نتائج جرد الخزينة</div>
          <div style={{ overflowX: "auto" }}>
            <table style={tblStyle}>
              <thead><tr><th style={th}>التاريخ</th><th style={th}>الخزينة</th><th style={th}>المعدود</th><th style={th}>الدفتري</th><th style={th}>الفرق</th></tr></thead>
              <tbody>
                {relevantCounts.map((c) => (
                  <tr key={c.id}>
                    <td style={td}>{c.date}</td>
                    <td style={td}>{treasuries.find((t) => t.id === c.treasuryId)?.name || "—"}</td>
                    <td style={td}>{fmt(c.totalCounted)}</td>
                    <td style={td}>{fmt(c.bookBalance)}</td>
                    <td style={{ ...td, fontWeight: 700, color: c.difference < 0 ? C.danger : (c.difference > 0 ? C.success : C.text) }}>{fmt(c.difference)}</td>
                  </tr>
                ))}
                {relevantCounts.length === 0 && <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد عمليات جرد في هذه الفترة</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ صرف رواتب موظفين الكاش ============ */
function monthLabel(m) {
  const [y, mo] = m.split("-");
  const names = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  return names[parseInt(mo, 10) - 1] + " " + y;
}
function currentMonthStr() {
  return new Date().toISOString().slice(0, 7);
}

function TreasuryPayroll({ currentUser, treasuries, employees, payrollRecords, custodies, institutionId, institutionName }) {
  const [view, setView] = useState("pay"); // "pay" | "employees"
  const [month, setMonth] = useState(currentMonthStr());
  const [treasuryId, setTreasuryId] = useState(treasuries[0]?.id || "");
  const [edits, setEdits] = useState({}); // { employeeId: { baseSalary, advanceDeduction, otherDeductions } }
  const [paying, setPaying] = useState(null);
  const [msg, setMsg] = useState("");

  const activeEmployees = employees.filter((e) => e.active !== false);

  // العهد/السلف القائمة لكل موظف (بالتفصيل، مرتبة الأقدم أولًا، عشان نخصم منها بالترتيب)
  const custodiesByEmployee = useMemo(() => {
    const map = {};
    custodies.forEach((c) => {
      const settled = (c.settlements || []).reduce((s, x) => s + (Number(x.cashReturned) || 0) + (Number(x.expensed) || 0), 0);
      const remaining = Math.max(0, (Number(c.amount) || 0) - settled);
      if (remaining <= 0) return;
      if (!map[c.employeeName]) map[c.employeeName] = [];
      map[c.employeeName].push({ ...c, remaining });
    });
    Object.keys(map).forEach((k) => map[k].sort((a, b) => (a.date || "").localeCompare(b.date || "")));
    return map;
  }, [custodies]);

  const custodyOutstanding = useMemo(() => {
    const map = {};
    Object.keys(custodiesByEmployee).forEach((name) => {
      map[name] = custodiesByEmployee[name].reduce((s, c) => s + c.remaining, 0);
    });
    return map;
  }, [custodiesByEmployee]);

  const paidThisMonth = useMemo(() => {
    const map = {};
    payrollRecords.filter((p) => p.month === month).forEach((p) => { map[p.employeeId] = p; });
    return map;
  }, [payrollRecords, month]);

  function getEdit(emp) {
    if (edits[emp.id]) return edits[emp.id];
    const outstanding = custodyOutstanding[emp.name] || 0;
    return { baseSalary: emp.baseSalary || 0, advanceDeduction: outstanding, otherDeductions: 0 };
  }
  function setEdit(empId, key, val, emp) {
    setEdits((e) => ({ ...e, [empId]: { ...getEdit(emp || employees.find((x) => x.id === empId) || {}), [key]: val } }));
  }

  function netFor(emp) {
    const ed = getEdit(emp);
    const base = Number(ed.baseSalary) || 0;
    const adv = Number(ed.advanceDeduction) || 0;
    const other = Number(ed.otherDeductions) || 0;
    return Math.max(0, base - adv - other);
  }

  const totals = useMemo(() => {
    let due = 0, paid = 0, count = 0, paidCount = 0;
    activeEmployees.forEach((emp) => {
      count++;
      const rec = paidThisMonth[emp.id];
      if (rec) { paid += Number(rec.netPaid) || 0; paidCount++; }
      else due += netFor(emp);
    });
    return { due, paid, count, paidCount };
    // eslint-disable-next-line
  }, [activeEmployees, paidThisMonth, edits]);

  // توزيع مبلغ خصم السلفة على سجلات عهدة الموظف بالترتيب (الأقدم أولًا) كتسويات "بدون رجوع نقدي" (خصمت من الراتب)
  async function settleAdvanceViaSalary(emp, amount, month) {
    let remaining = amount;
    const list = custodiesByEmployee[emp.name] || [];
    for (const c of list) {
      if (remaining <= 0) break;
      const take = Math.min(remaining, c.remaining);
      if (take <= 0) continue;
      await CUSTODIES_COL.doc(c.id).update({
        settlements: firebase.firestore.FieldValue.arrayUnion({
          date: todayStr(), cashReturned: 0, expensed: take,
          note: "خصم من راتب شهر " + monthLabel(month), by: currentUser.name, at: Date.now(),
        }),
      });
      remaining -= take;
    }
  }

  async function payEmployee(emp) {
    if (paidThisMonth[emp.id]) { setMsg("الراتب اتصرف بالفعل لهذا الموظف في " + monthLabel(month)); return; }
    if (!treasuryId) { setMsg("اختر الخزينة اللي هيتم الصرف منها"); return; }
    const ed = getEdit(emp);
    const advanceDeduction = Number(ed.advanceDeduction) || 0;
    const outstanding = custodyOutstanding[emp.name] || 0;
    if (advanceDeduction > outstanding + 0.01) {
      setMsg("مبلغ خصم السلفة (" + fmt(advanceDeduction) + ") أكبر من السلفة القائمة فعليًا (" + fmt(outstanding) + ") — قلّل المبلغ");
      return;
    }
    const net = netFor(emp);
    if (net <= 0) { setMsg("صافي الراتب لازم يكون أكبر من صفر"); return; }
    setPaying(emp.id); setMsg("");
    try {
      const txRef = await TREASURY_TX_COL.add({
        treasuryId, type: "expense", amount: net, date: todayStr(),
        description: "راتب شهر " + monthLabel(month) + " — " + emp.name + (advanceDeduction > 0 ? " (بعد خصم سلفة " + fmt(advanceDeduction) + ")" : ""),
        category: "رواتب وأجور", institutionId,
        enteredBy: currentUser.name, enteredByRole: currentUser.role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      if (advanceDeduction > 0) {
        await settleAdvanceViaSalary(emp, advanceDeduction, month);
      }
      await PAYROLL_COL.add({
        employeeId: emp.id, employeeName: emp.name, month, treasuryId,
        baseSalary: Number(ed.baseSalary) || 0, advanceDeduction, otherDeductions: Number(ed.otherDeductions) || 0,
        deductions: advanceDeduction + (Number(ed.otherDeductions) || 0), netPaid: net,
        txId: txRef.id, institutionId, paidBy: currentUser.name,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setMsg("✅ تم صرف راتب " + emp.name + " بنجاح" + (advanceDeduction > 0 ? " — وتم خصم " + fmt(advanceDeduction) + " ر.س من السلفة/العهدة القائمة" : ""));
    } catch (e) { setMsg("خطأ: " + e.message); }
    setPaying(null);
  }

  function doPrint() { window.print(); }

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }} className="no-print">
        <button onClick={() => setView("pay")} style={view === "pay" ? smallBtn : ghostBtn}>💵 صرف الرواتب</button>
        <button onClick={() => setView("advance")} style={view === "advance" ? smallBtn : ghostBtn}>💸 صرف سلفة</button>
        <button onClick={() => setView("employees")} style={view === "employees" ? smallBtn : ghostBtn}>👥 إدارة الموظفين</button>
      </div>

      {view === "employees" ? (
        <PayrollEmployees employees={employees} institutionId={institutionId} treasuries={treasuries} />
      ) : view === "advance" ? (
        <PayrollAdvances
          currentUser={currentUser} employees={activeEmployees} treasuries={treasuries}
          custodiesByEmployee={custodiesByEmployee} custodyOutstanding={custodyOutstanding} institutionId={institutionId}
        />
      ) : (
        <div>
          <div style={cardStyle} className="no-print">
            <div style={cardTitle}>💵 صرف الرواتب</div>
            <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div>
                <label style={smallLabel}>الشهر</label>
                <input type="month" value={month} onChange={(e) => setMonth(e.target.value)} style={inputStyle2} />
              </div>
              <div>
                <label style={smallLabel}>الصرف من خزينة</label>
                <select value={treasuryId} onChange={(e) => setTreasuryId(e.target.value)} style={inputStyle2}>
                  {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
              </div>
              <div style={{ marginRight: "auto" }}><button onClick={doPrint} style={smallBtn}>🖨️ طباعة كشف الرواتب</button></div>
            </div>
          </div>

          <div className="print-area">
            <div className="print-only-header">
              <h2>{institutionName}</h2>
              <div>كشف رواتب — {monthLabel(month)}</div>
            </div>

            <div style={cardStyle}>
              <div style={cardTitle}>📌 ملخّص {monthLabel(month)}</div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                {[
                  { label: "عدد الموظفين النشطين", val: totals.count, plain: true },
                  { label: "تم صرفهم", val: totals.paidCount, plain: true },
                  { label: "إجمالي المصروف فعليًا", val: totals.paid, highlight: true },
                  { label: "إجمالي المتبقي المستحق", val: totals.due, highlight: true, big: true },
                ].map((it) => (
                  <div key={it.label} style={{
                    flex: "1 1 180px", background: it.big ? "linear-gradient(135deg,#0f2557,#1d4ed8)" : C.blueSoft,
                    border: "1px solid " + (it.big ? "transparent" : C.border), borderRadius: 10, padding: "11px 13px"
                  }}>
                    <div style={{ fontSize: 12, color: it.big ? "#dbe6ff" : C.muted, marginBottom: 4 }}>{it.label}</div>
                    <div style={{ fontSize: 18, fontWeight: 800, color: it.big ? "#fff" : C.navy }}>{it.plain ? it.val : fmt(it.val)}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={cardStyle}>
              <div style={cardTitle}>📋 قائمة الصرف</div>
              {msg && <div className="no-print" style={{ fontSize: 13, marginBottom: 10, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
              <div style={{ overflowX: "auto" }}>
                <table style={tblStyle}>

                  <tbody>

function PayrollAdvances({ currentUser, employees, treasuries, custodiesByEmployee, custodyOutstanding, institutionId }) {
  const [amountsCash, setAmountsCash] = useState({}); // { employeeId: cashAmount }
  const [amountsBank, setAmountsBank] = useState({}); // { employeeId: bankAmount }
  const [treasuryChoice, setTreasuryChoice] = useState(treasuries[0]?.id || "");
  const [note, setNote] = useState({}); // { employeeId: note }
  const [giving, setGiving] = useState(null);
  const [msg, setMsg] = useState("");
  const [expanded, setExpanded] = useState(null);

  async function giveAdvance(emp) {
    const cashPart = Number(amountsCash[emp.id]) || 0;
    const bankPart = Number(amountsBank[emp.id]) || 0;
    const amt = cashPart + bankPart;
    if (!amt || amt <= 0) { setMsg("أدخل مبلغ سلفة نقدي أو بنكي صحيح للموظف " + emp.name); return; }
    if (!treasuryChoice) { setMsg("اختر الخزينة اللي هتصرف منها السلفة"); return; }
    setGiving(emp.id); setMsg("");
    try {
      const custodyRef = await CUSTODIES_COL.add({
        treasuryId: treasuryChoice, employeeName: emp.name, amount: amt, amountCash: cashPart, amountBank: bankPart, date: todayStr(),
        description: "سلفة" + (note[emp.id] ? " — " + note[emp.id] : ""), kind: "advance",
        institutionId, settlements: [], createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await TREASURY_TX_COL.add({
        treasuryId: treasuryChoice, type: "custody_out", amount: amt, date: todayStr(),
        description: "سلفة" + (note[emp.id] ? " — " + note[emp.id] : ""), employeeName: emp.name,
        custodyId: custodyRef.id, institutionId,
        enteredBy: currentUser.name, enteredByRole: currentUser.role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setAmountsCash((a) => ({ ...a, [emp.id]: "" }));
      setAmountsBank((a) => ({ ...a, [emp.id]: "" }));
      setNote((n) => ({ ...n, [emp.id]: "" }));
      setExpanded(null);
      setMsg("✅ تم صرف سلفة " + fmt(amt) + " ر.س لـ" + emp.name + " — هتتخصم تلقائيًا من راتبه القادم");
    } catch (e) { setMsg("خطأ: " + e.message); }
    setGiving(null);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>💸 صرف سلفة لموظف</div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
          أي سلفة تصرفها هنا بتتسجل تلقائيًا وبتظهر كخصم جاهز عند صرف راتب الموظف في "💵 صرف الرواتب" — من غير أي خطوة إضافية.
        </div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>الصرف من خزينة</label>
          <select value={treasuryChoice} onChange={(e) => setTreasuryChoice(e.target.value)} style={{ ...inputStyle2, maxWidth: 260 }}>
            {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
        {msg && <div style={{ fontSize: 13, marginBottom: 12, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
        <div style={{ overflowX: "auto" }}>
          <table style={tblStyle}>
            <thead><tr><th style={th}>الموظف</th><th style={th}>سلفة قائمة حاليًا</th><th style={th}>💵 مبلغ نقدي</th><th style={th}>💳 مبلغ شبكة/بنك</th><th style={th}></th></tr></thead>
            <tbody>
              {employees.map((emp) => {
                const outstanding = custodyOutstanding[emp.name] || 0;
                return (
                  <React.Fragment key={emp.id}>
                    <tr>
                      <td style={{ ...td, fontWeight: 700 }}>{emp.name}</td>
                      <td style={{ ...td, color: outstanding > 0 ? C.danger : C.muted, fontWeight: outstanding > 0 ? 700 : 400 }}>{outstanding > 0 ? fmt(outstanding) : "—"}</td>
                      <td style={td}>
                        <input type="number" step="0.01" placeholder="0.00" value={amountsCash[emp.id] || ""}
                          onChange={(e) => setAmountsCash((a) => ({ ...a, [emp.id]: e.target.value }))} style={{ ...inputStyle2, width: 100 }} />
                      </td>
                      <td style={td}>
                        <input type="number" step="0.01" placeholder="0.00" value={amountsBank[emp.id] || ""}
                          onChange={(e) => setAmountsBank((a) => ({ ...a, [emp.id]: e.target.value }))} style={{ ...inputStyle2, width: 100 }} />
                      </td>
                      <td style={td}>
                        <span onClick={() => setExpanded(expanded === emp.id ? null : emp.id)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, marginLeft: 10 }}>
                          {expanded === emp.id ? "إخفاء الملاحظة" : "+ ملاحظة"}
                        </span>
                        <button onClick={() => giveAdvance(emp)} disabled={giving === emp.id} style={smallBtn}>
                          {giving === emp.id ? "جارِ الصرف..." : "💸 صرف السلفة"}
                        </button>
                      </td>
                    </tr>
                    {expanded === emp.id && (
                      <tr>
                        <td colSpan={5} style={{ background: C.blueSoft, padding: 12 }}>
                          <label style={smallLabel}>سبب السلفة (اختياري)</label>
                          <input value={note[emp.id] || ""} onChange={(e) => setNote((n) => ({ ...n, [emp.id]: e.target.value }))}
                            style={{ ...inputStyle2, maxWidth: 320 }} placeholder="مثال: ظرف طارئ، مصاريف علاج..." />
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {employees.length === 0 && <tr><td colSpan={5} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد موظفين نشطين — أضفهم من "إدارة الموظفين" الأول</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function PayrollEmployees({ employees, institutionId, treasuries }) {
  const [form, setForm] = useState({ name: "", baseSalary: "", treasuryId: treasuries[0]?.id || "" });
  const [editingId, setEditingId] = useState(null);
  const [msg, setMsg] = useState("");

  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }

  async function save() {
    if (!form.name.trim() || !form.baseSalary) { setMsg("أدخل اسم الموظف والراتب الأساسي"); return; }
    try {
      if (editingId) {
        await EMPLOYEES_COL.doc(editingId).update({
          name: form.name.trim(), baseSalary: Number(form.baseSalary) || 0, treasuryId: form.treasuryId,
        });
      } else {
        await EMPLOYEES_COL.add({
          name: form.name.trim(), baseSalary: Number(form.baseSalary) || 0, treasuryId: form.treasuryId,
          active: true, institutionId, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      setForm({ name: "", baseSalary: "", treasuryId: treasuries[0]?.id || "" });
      setEditingId(null);
      setMsg("");
    } catch (e) { setMsg("خطأ: " + e.message); }
  }

  function editEmp(e) {
    setForm({ name: e.name, baseSalary: e.baseSalary, treasuryId: e.treasuryId || treasuries[0]?.id || "" });
    setEditingId(e.id);
  }
  async function toggleActive(e) {
    await EMPLOYEES_COL.doc(e.id).update({ active: e.active === false });
  }
  async function removeEmployee(e) {
    if (!confirm('هل تريد حذف الموظف "' + e.name + '"؟ (سجلات الرواتب السابقة هتفضل موجودة)')) return;
    await EMPLOYEES_COL.doc(e.id).delete();
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>{editingId ? "✏️ تعديل موظف" : "➕ إضافة موظف يُصرف له راتب كاش"}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div><label style={smallLabel}>اسم الموظف</label><input value={form.name} onChange={(e) => set("name", e.target.value)} style={inputStyle2} /></div>
          <div><label style={smallLabel}>الراتب الأساسي</label><input type="number" step="0.01" value={form.baseSalary} onChange={(e) => set("baseSalary", e.target.value)} style={{ ...inputStyle2, width: 140 }} /></div>
          <div>
            <label style={smallLabel}>خزينة الصرف الافتراضية</label>
            <select value={form.treasuryId} onChange={(e) => set("treasuryId", e.target.value)} style={inputStyle2}>
              {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <button onClick={save} style={smallBtn}>{editingId ? "حفظ التعديل" : "إضافة"}</button>
          {editingId && <button onClick={() => { setEditingId(null); setForm({ name: "", baseSalary: "", treasuryId: treasuries[0]?.id || "" }); }} style={ghostBtn}>إلغاء</button>}
        </div>
        {msg && <div style={{ marginTop: 8, fontSize: 13, color: C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>👥 كل الموظفين ({employees.length})</div>
        <div style={{ overflowX: "auto" }}>
          <table style={tblStyle}>
            <thead><tr><th style={th}>الاسم</th><th style={th}>الراتب الأساسي</th><th style={th}>الحالة</th><th style={th}></th></tr></thead>
            <tbody>
              {employees.map((e) => (
                <tr key={e.id}>
                  <td style={td}>{e.name}</td>
                  <td style={td}>{fmt(e.baseSalary)}</td>
                  <td style={{ ...td, color: e.active === false ? C.muted : C.success, fontWeight: 700 }}>{e.active === false ? "غير نشط" : "نشط"}</td>
                  <td style={td}>
                    <span onClick={() => editEmp(e)} style={{ cursor: "pointer", color: C.blue, marginLeft: 10, fontWeight: 700 }}>تعديل</span>
                    <span onClick={() => toggleActive(e)} style={{ cursor: "pointer", color: "#d97706", marginLeft: 10, fontWeight: 700 }}>{e.active === false ? "تفعيل" : "إيقاف"}</span>
                    <span onClick={() => removeEmployee(e)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>حذف</span>
                  </td>
                </tr>
              ))}
              {employees.length === 0 && <tr><td colSpan={4} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد موظفين مسجلين بعد</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function TreasuryNewTx({ currentUser, treasuries, users, institutionId, institutionName }) {
  const [type, setType] = useState("deposit");
  const [treasuryId, setTreasuryId] = useState(treasuries[0]?.id || "");
  const [toTreasuryId, setToTreasuryId] = useState(treasuries[1]?.id || treasuries[0]?.id || "");
  const [employeeName, setEmployeeName] = useState("");
  const [amount, setAmount] = useState("");
  const [amountCash, setAmountCash] = useState("");
  const [amountBank, setAmountBank] = useState("");
  const [date, setDate] = useState(todayStr());
  const [description, setDescription] = useState("");
  const [category, setCategory] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [freshVoucher, setFreshVoucher] = useState(null);

  async function save() {
    const isCustody = type === "custody_out";
    const cashPart = Number(amountCash) || 0;
    const bankPart = Number(amountBank) || 0;
    const amt = isCustody ? (cashPart + bankPart) : Number(amount);
    if (!amt || amt <= 0) { setMsg(isCustody ? "أدخل مبلغ نقدي أو بنكي أكبر من صفر" : "أدخل مبلغ صحيح أكبر من صفر"); return; }
    if (!treasuryId) { setMsg("اختر الخزينة"); return; }
    if (type === "transfer_out" && (!toTreasuryId || toTreasuryId === treasuryId)) { setMsg("اختر خزينة وجهة مختلفة عن المصدر"); return; }
    if (isCustody && !employeeName) { setMsg("اختر أو اكتب اسم الموظف"); return; }

    setSaving(true); setMsg("");
    try {
      const base = { date, description, institutionId, enteredBy: currentUser.name, enteredByRole: currentUser.role, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      let voucherTx = null;
      if (type === "transfer_out") {
        const transferGroupId = uid();
        const outRef = await TREASURY_TX_COL.add({ ...base, treasuryId, type: "transfer_out", amount: amt, relatedTreasuryId: toTreasuryId, transferGroupId });
        await TREASURY_TX_COL.add({ ...base, treasuryId: toTreasuryId, type: "transfer_in", amount: amt, relatedTreasuryId: treasuryId, transferGroupId });
        setMsg("✅ تم تسجيل التحويل بنجاح — السند جاهز تحت للطباعة");
        voucherTx = { id: outRef.id, treasuryId, type: "transfer_out", amount: amt, relatedTreasuryId: toTreasuryId, date, description };
      } else if (isCustody) {
        const custodyRef = await CUSTODIES_COL.add({
          treasuryId, employeeName, amount: amt, amountCash: cashPart, amountBank: bankPart,
          date, description, institutionId, settlements: [], createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        const txRef = await TREASURY_TX_COL.add({ ...base, treasuryId, type: "custody_out", amount: amt, employeeName, custodyId: custodyRef.id });
        setMsg("✅ تم تسجيل العهدة بنجاح — السند جاهز تحت للطباعة");
        voucherTx = { id: txRef.id, treasuryId, type: "custody_out", amount: amt, employeeName, date, description };
      } else {
        const txRef = await TREASURY_TX_COL.add({ ...base, treasuryId, type, amount: amt, category: category || "" });
        setMsg("✅ تم تسجيل الحركة بنجاح — السند جاهز تحت للطباعة");
        voucherTx = { id: txRef.id, treasuryId, type, amount: amt, category: category || "", date, description };
      }
      setAmount(""); setAmountCash(""); setAmountBank(""); setDescription(""); setEmployeeName(""); setCategory("");
      const voucherNo = await assignVoucherNoIfMissing(voucherTx, institutionId);
      setFreshVoucher({ ...voucherTx, voucherNo, enteredBy: currentUser.name });
    } catch (e) { setMsg("خطأ: " + e.message); }
    setSaving(false);
  }

  const cashierNames = Array.from(new Set(users.map((u) => u.name)));

  return (
    <div>
    <div style={cardStyle} className="no-print">
      <div style={cardTitle}>➕ تسجيل حركة خزينة جديدة</div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        {[["deposit", "إيداع / توريد"], ["expense", "صرف"], ["transfer_out", "تحويل بين خزائن"], ["custody_out", "عهدة لموظف"]].map(([k, l]) => (
          <button key={k} onClick={() => setType(k)} style={type === k ? smallBtn : ghostBtn}>{l}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 14 }}>
        <div style={{ flex: "1 1 200px" }}>
          <label style={smallLabel}>{type === "transfer_out" ? "من خزينة" : "الخزينة"}</label>
          <select value={treasuryId} onChange={(e) => setTreasuryId(e.target.value)} style={inputStyle2}>
            {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
        {type === "transfer_out" && (
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>إلى خزينة</label>
            <select value={toTreasuryId} onChange={(e) => setToTreasuryId(e.target.value)} style={inputStyle2}>
              {treasuries.filter((t) => t.id !== treasuryId).map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
        )}
        {type === "custody_out" && (
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>اسم الموظف</label>
            <input list="emp-names" value={employeeName} onChange={(e) => setEmployeeName(e.target.value)} style={inputStyle2} placeholder="اكتب أو اختر اسم" />
            <datalist id="emp-names">{cashierNames.map((n) => <option key={n} value={n} />)}</datalist>
          </div>
        )}
        {(type === "deposit" || type === "expense") && (
          <div style={{ flex: "1 1 200px" }}>
            <label style={smallLabel}>الفئة (اختياري)</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)} style={inputStyle2}>
              <option value="">بدون تصنيف</option>
              {TX_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        )}
        <div style={{ flex: "1 1 160px" }}>
          {type === "custody_out" ? (
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <div>
                <label style={smallLabel}>💵 مبلغ نقدي (كاش)</label>
                <input type="number" step="0.01" value={amountCash} onChange={(e) => setAmountCash(e.target.value)} style={{ ...inputStyle2, width: 140 }} />
              </div>
              <div>
                <label style={smallLabel}>💳 مبلغ عن طريق الشبكة/البنك</label>
                <input type="number" step="0.01" value={amountBank} onChange={(e) => setAmountBank(e.target.value)} style={{ ...inputStyle2, width: 140 }} />
              </div>
              {(Number(amountCash) > 0 || Number(amountBank) > 0) && (
                <div style={{ fontSize: 12, color: C.muted, alignSelf: "center" }}>الإجمالي: {fmt((Number(amountCash) || 0) + (Number(amountBank) || 0))} ر.س</div>
              )}
            </div>
          ) : (
            <>
              <label style={smallLabel}>المبلغ</label>
              <input type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} style={inputStyle2} />
            </>
          )}
        </div>
        <div style={{ flex: "1 1 160px" }}>
          <label style={smallLabel}>التاريخ</label>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle2} />
        </div>
        <div style={{ flex: "1 1 100%" }}>
          <label style={smallLabel}>البيان / الوصف</label>
          <input value={description} onChange={(e) => setDescription(e.target.value)} style={inputStyle2} placeholder="مثال: توريد مبيعات نقدية، صرف فاتورة كهرباء، عهدة شراء مستلزمات..." />
        </div>
      </div>
      <button onClick={save} disabled={saving} style={{ ...smallBtn, padding: "11px 26px", fontSize: 15 }}>
        {saving ? "جارِ الحفظ..." : "💾 حفظ الحركة"}
      </button>
      {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
    </div>
    <TreasuryNewTxVoucherWrapper freshVoucher={freshVoucher} treasuries={treasuries} institutionName={institutionName} setFreshVoucher={setFreshVoucher} />

  );
}
