function TreasuryLedger({ treasuries, txs, institutionName }) {
  const [treasuryId, setTreasuryId] = useState(treasuries[0]?.id || "");
  const [fromDate, setFromDate] = useState(firstDayOfMonth());
  const [toDate, setToDate] = useState(todayStr());
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ amount: "", date: "", description: "", category: "" });
  const [actionMsg, setActionMsg] = useState("");

  const treasury = treasuries.find((t) => t.id === treasuryId);
  const rows = useMemo(() => {
    return txs
      .filter((t) => t.treasuryId === treasuryId && t.date >= fromDate && t.date <= toDate)
      .sort((a, b) => (a.date + (a.createdAt?.seconds || 0)).localeCompare(b.date + (b.createdAt?.seconds || 0)));
  }, [txs, treasuryId, fromDate, toDate]);

  let running = treasury ? Number(treasury.openingBalance) || 0 : 0;
  txs.filter((t) => t.treasuryId === treasuryId && t.date < fromDate).forEach((t) => {
    const amt = Number(t.amount) || 0;
    if (t.type === "deposit" || t.type === "transfer_in" || t.type === "custody_settle") running += amt;
    else running -= amt;
  });
  const openingForPeriod = running;
  const ledgerRows = rows.map((t) => {
    const amt = Number(t.amount) || 0;
    const isIn = t.type === "deposit" || t.type === "transfer_in" || t.type === "custody_settle";
    running += isIn ? amt : -amt;
    return { ...t, isIn, runningBalance: running };
  });

  function doPrint() { window.print(); }

  const EDITABLE_TYPES = ["deposit", "expense", "transfer_out", "transfer_in"];

  function startEdit(t) {
    setActionMsg("");
    setEditingId(t.id);
    setEditForm({ amount: t.amount, date: t.date, description: t.description || "", category: t.category || "" });
  }
  function cancelEdit() { setEditingId(null); }

  async function saveEdit(t) {
    const amt = Number(editForm.amount);
    if (!amt || amt <= 0) { setActionMsg("أدخل مبلغ صحيح أكبر من صفر"); return; }
    try {
      const updates = { amount: amt, date: editForm.date, description: editForm.description };
      if (t.type === "deposit" || t.type === "expense") updates.category = editForm.category || "";
      await TREASURY_TX_COL.doc(t.id).update(updates);
      if (t.type === "transfer_out" || t.type === "transfer_in") {
        const sibling = txs.find((x) => x.transferGroupId === t.transferGroupId && x.id !== t.id);
        if (sibling) await TREASURY_TX_COL.doc(sibling.id).update({ amount: amt, date: editForm.date, description: editForm.description });
      }
      setEditingId(null);
      setActionMsg("");
    } catch (e) { setActionMsg("خطأ: " + e.message); }
  }

  async function deleteTx(t) {
    if (t.type === "custody_settle") {
      alert('لتعديل أو حذف تسوية عهدة، راجع سجل العهدة من قسم "عهد الموظفين".');
      return;
    }
    if (t.type === "custody_out") {
      const snap = await CUSTODIES_COL.doc(t.custodyId).get().catch(() => null);
      const hasSettlements = snap && snap.exists && (snap.data().settlements || []).length > 0;
      if (hasSettlements) {
        alert('لا يمكن حذف هذه العهدة لأن عليها تسويات مسجلة بالفعل. راجعها من قسم "عهد الموظفين" أولاً.');
        return;
      }
      if (!confirm("سيتم حذف العهدة بالكامل مع حركتها من الخزينة. هل تريد المتابعة؟")) return;
      await TREASURY_TX_COL.doc(t.id).delete();
      if (t.custodyId) await CUSTODIES_COL.doc(t.custodyId).delete().catch(() => {});
      return;
    }
    if (t.type === "transfer_out" || t.type === "transfer_in") {
      if (!confirm("هذه حركة تحويل بين خزينتين — سيتم حذف الطرفين (الصادر والوارد) معًا. هل تريد المتابعة؟")) return;
      const sibling = txs.find((x) => x.transferGroupId === t.transferGroupId && x.id !== t.id);
      await TREASURY_TX_COL.doc(t.id).delete();
      if (sibling) await TREASURY_TX_COL.doc(sibling.id).delete();
      return;
    }
    if (!confirm("هل تريد حذف هذه الحركة؟")) return;
    await TREASURY_TX_COL.doc(t.id).delete();
  }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>📒 كشف حساب خزينة</div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-end" }}>
          <div>
            <label style={smallLabel}>الخزينة</label>
            <select value={treasuryId} onChange={(e) => setTreasuryId(e.target.value)} style={inputStyle2}>
              {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div><label style={smallLabel}>من تاريخ</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
          <div><label style={smallLabel}>إلى تاريخ</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
          <button onClick={doPrint} style={smallBtn}>🖨️ طباعة / حفظ PDF</button>
        </div>
      </div>

      <div className="print-area">
        <div className="print-only-header">
          <h2>{institutionName}</h2>
          <div>كشف حساب: {treasury?.name} — من {fromDate} إلى {toDate}</div>
        </div>
        <div style={cardStyle}>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
            <div style={{ flex: "1 1 180px", background: C.blueSoft, borderRadius: 10, padding: "11px 13px" }}>
              <div style={{ fontSize: 12, color: C.muted }}>الرصيد الافتتاحي للفترة</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: C.navy }}>{fmt(openingForPeriod)}</div>
            </div>
            <div style={{ flex: "1 1 180px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "11px 13px" }}>
              <div style={{ fontSize: 12, color: "#dbe6ff" }}>الرصيد الختامي للفترة</div>
              <div style={{ fontSize: 18, fontWeight: 800, color: "#fff" }}>{fmt(running)}</div>
            </div>
          </div>
          {actionMsg && <div style={{ color: C.danger, fontSize: 13, marginBottom: 10 }} className="no-print">{actionMsg}</div>}
          <div style={{ overflowX: "auto" }}>
            <table style={tblStyle}>
              <thead><tr><th style={th}>التاريخ</th><th style={th}>نوع الحركة</th><th style={th}>البيان</th><th style={th}>مدين (صادر)</th><th style={th}>دائن (وارد)</th><th style={th}>الرصيد</th><th style={th} className="no-print"></th></tr></thead>
              <tbody>
                {ledgerRows.map((r) => (
                  <React.Fragment key={r.id}>
                    <tr>
                      <td style={td}>{r.date}</td>
                      <td style={td}>{TX_TYPE_LABELS[r.type] || r.type}</td>
                      <td style={td}>{r.description || (r.employeeName ? "عهدة: " + r.employeeName : "—")}</td>
                      <td style={{ ...td, color: C.danger }}>{r.isIn ? "" : fmt(r.amount)}</td>
                      <td style={{ ...td, color: C.success }}>{r.isIn ? fmt(r.amount) : ""}</td>
                      <td style={{ ...td, fontWeight: 700 }}>{fmt(r.runningBalance)}</td>
                      <td style={td} className="no-print">
                        {EDITABLE_TYPES.includes(r.type) && (
                          <span onClick={() => (editingId === r.id ? cancelEdit() : startEdit(r))} style={{ cursor: "pointer", color: C.blue, marginLeft: 10, fontWeight: 700 }}>
                            {editingId === r.id ? "إلغاء" : "تعديل"}
                          </span>
                        )}
                        <span onClick={() => deleteTx(r)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>حذف</span>
                      </td>
                    </tr>
                    {editingId === r.id && (
                      <tr className="no-print">
                        <td colSpan={7} style={{ background: C.blueSoft, padding: 14 }}>
                          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
                            <div><label style={smallLabel}>المبلغ</label><input type="number" step="0.01" value={editForm.amount} onChange={(e) => setEditForm((f) => ({ ...f, amount: e.target.value }))} style={{ ...inputStyle2, width: 130 }} /></div>
                            <div><label style={smallLabel}>التاريخ</label><input type="date" value={editForm.date} onChange={(e) => setEditForm((f) => ({ ...f, date: e.target.value }))} style={inputStyle2} /></div>
                            {(r.type === "deposit" || r.type === "expense") && (
                              <div>
                                <label style={smallLabel}>الفئة</label>
                                <select value={editForm.category} onChange={(e) => setEditForm((f) => ({ ...f, category: e.target.value }))} style={inputStyle2}>
                                  <option value="">بدون تصنيف</option>
                                  {TX_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                                </select>
                              </div>
                            )}
                            <div style={{ flex: "1 1 200px" }}><label style={smallLabel}>البيان</label><input value={editForm.description} onChange={(e) => setEditForm((f) => ({ ...f, description: e.target.value }))} style={inputStyle2} /></div>
                            <button onClick={() => saveEdit(r)} style={smallBtn}>حفظ</button>
                          </div>
                          {(r.type === "transfer_out" || r.type === "transfer_in") && (
                            <div style={{ fontSize: 11.5, color: C.muted, marginTop: 8 }}>ملحوظة: تعديل المبلغ/التاريخ/البيان هنا هيتحدّث تلقائيًا في الخزينة التانية طرف التحويل.</div>
                          )}
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
                {ledgerRows.length === 0 && <tr><td colSpan={7} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد حركات في هذه الفترة</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );
}

function TreasuryCustody({ currentUser, treasuries, custodies, users, institutionName }) {
  const canSettle = currentUser.role === "admin" || currentUser.role === "financial_manager";
  const [filterStatus, setFilterStatus] = useState("all");
  const [filterKind, setFilterKind] = useState("all"); // "all" | "custody" | "advance"
  const [searchName, setSearchName] = useState("");
  const [settlingId, setSettlingId] = useState(null);
  const [cashReturned, setCashReturned] = useState("");
  const [repaymentMethod, setRepaymentMethod] = useState("cash"); // "cash" | "card"
  const [expensed, setExpensed] = useState("");
  const [note, setNote] = useState("");
  const [msg, setMsg] = useState("");
  const [expenseLogs, setExpenseLogs] = useState({}); // { custodyId: [...expenses] }
  const [viewMode, setViewMode] = useState("flat"); // "flat" | "grouped"
  const [expandedEmployee, setExpandedEmployee] = useState(null);
  const [fullStatementFor, setFullStatementFor] = useState(null); // اسم موظف نعرض له كشف حساب شامل
  const [selectedExpenseIds, setSelectedExpenseIds] = useState({}); // { custodyId: { expenseId: true } }

  function toggleExpenseSelection(custodyId, expenseId) {
    setSelectedExpenseIds((prev) => {
      const cur = prev[custodyId] || {};
      return { ...prev, [custodyId]: { ...cur, [expenseId]: !cur[expenseId] } };
    });
  }
  function toggleAllExpenseSelection(custodyId, log, value) {
    const next = {};
    log.forEach((e) => { next[e.id] = value; });
    setSelectedExpenseIds((prev) => ({ ...prev, [custodyId]: next }));
  }

  function remainingOf(c) {
    const settled = (c.settlements || []).reduce((s, x) => s + (Number(x.cashReturned) || 0) + (Number(x.expensed) || 0), 0);
    return Math.max(0, (Number(c.amount) || 0) - settled);
  }
  function statusOf(c) {
    const rem = remainingOf(c);
    if (rem <= 0.009) return "settled";
    if (rem < (Number(c.amount) || 0)) return "partial";
    return "outstanding";
  }
  const STATUS_LABEL = { settled: "مسددة بالكامل", partial: "مسددة جزئيًا", outstanding: "قائمة" };
  const STATUS_COLOR = { settled: C.success, partial: "#d97706", outstanding: C.danger };

  const filtered = custodies.filter((c) => {
    if (filterStatus !== "all" && statusOf(c) !== filterStatus) return false;
    if (filterKind === "advance" && c.kind !== "advance") return false;
    if (filterKind === "custody" && c.kind === "advance") return false;
    if (searchName.trim() && !(c.employeeName || "").toLowerCase().includes(searchName.trim().toLowerCase())) return false;
    return true;
  });

  // لما تبحث باسم موظف معيّن، وريه ملخّص فوري: إجمالي المتبقي عليه من كل عهده وسلفه (بغض النظر عن فلتر الحالة/النوع)
  const searchedEmployeeSummary = useMemo(() => {
    const term = searchName.trim().toLowerCase();
    if (!term) return null;
    const matches = custodies.filter((c) => (c.employeeName || "").toLowerCase().includes(term));
    if (matches.length === 0) return null;
    const byName = {};
    matches.forEach((c) => {
      const key = c.employeeName;
      if (!byName[key]) byName[key] = { name: key, count: 0, remaining: 0, totalReceived: 0 };
      byName[key].count += 1;
      byName[key].remaining += remainingOf(c);
      byName[key].totalReceived += Number(c.amount) || 0;
    });
    return Object.values(byName);
    // eslint-disable-next-line
  }, [searchName, custodies]);

  // تجميع القائمة المفلترة حسب الموظف — لكل موظف: عدد عهده/سلفه، إجمالي المستلم، والمتبقي الرسمي (تسويات)
  const grouped = useMemo(() => {
    const byName = {};
    filtered.forEach((c) => {
      const key = c.employeeName || "—";
      if (!byName[key]) byName[key] = { name: key, items: [], totalReceived: 0, totalRemaining: 0 };
      byName[key].items.push(c);
      byName[key].totalReceived += Number(c.amount) || 0;
      byName[key].totalRemaining += remainingOf(c);
    });
    return Object.values(byName).sort((a, b) => b.totalRemaining - a.totalRemaining);
    // eslint-disable-next-line
  }, [filtered]);

  // تحميل مصروفات العهدة (من مجموعتها الفرعية) عند فتح مراجعتها فقط — تحميل عند الطلب مش لكل العهد دفعة واحدة
  useEffect(() => {
    if (!settlingId) return;
    const unsub = custodyExpensesCol(settlingId).onSnapshot((snap) => {
      const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      list.sort((a, b) => (a.enteredAt || 0) - (b.enteredAt || 0));
      setExpenseLogs((prev) => ({ ...prev, [settlingId]: list }));
    });
    return unsub;
  }, [settlingId]);

  async function removeAttachment(custodyId, entryId) {
    if (!confirm("تحذف هذا المرفق (الصورة/PDF) بعد مراجعته؟")) return;
    await custodyExpensesCol(custodyId).doc(entryId).update({ photoUrl: null, fileType: null });
  }

  async function submitSettlement(c) {
    const cash = Number(cashReturned) || 0;
    const exp = Number(expensed) || 0;
    const rem = remainingOf(c);
    if (cash + exp <= 0) { setMsg("أدخل مبلغ مرتجع (كاش أو بطاقة) أو مصروف بإيصالات"); return; }
    if (cash + exp > rem + 0.01) { setMsg("المبلغ المدخل أكبر من المتبقي في العهدة (" + fmt(rem) + ")"); return; }
    try {
      await CUSTODIES_COL.doc(c.id).update({
        settlements: firebase.firestore.FieldValue.arrayUnion({
          date: todayStr(), cashReturned: cash, repaymentMethod: cash > 0 ? repaymentMethod : null,
          expensed: exp, note, by: currentUser.name, at: Date.now(),
        }),
      });
      if (cash > 0) {
        const methodLabel = repaymentMethod === "card" ? "بطاقة/تحويل" : "كاش";
        await TREASURY_TX_COL.add({
          treasuryId: c.treasuryId, type: "custody_settle", amount: cash, date: todayStr(),
          description: "تسوية عهدة " + c.employeeName + " (سداد " + methodLabel + ")" + (note ? " — " + note : ""), custodyId: c.id,
          repaymentMethod, enteredBy: currentUser.name, enteredByRole: currentUser.role, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
      setSettlingId(null); setCashReturned(""); setExpensed(""); setNote(""); setRepaymentMethod("cash"); setMsg("");
    } catch (e) { setMsg("خطأ: " + e.message); }
  }

  if (fullStatementFor) {
    return (
      <EmployeeCombinedStatement
        employeeName={fullStatementFor} institutionId={currentUser.institutionId || DEFAULT_INSTITUTION_ID}
        institutionName={institutionName} onClose={() => setFullStatementFor(null)}
      />
    );
  }

  function renderCustodyRow(c) {
    const rem = remainingOf(c);
              const status = statusOf(c);
              const treasuryName = treasuries.find((t) => t.id === c.treasuryId)?.name || "—";
              return (
                <React.Fragment key={c.id}>
                  <tr>
                    <td style={td}>{c.date}</td>
                    <td style={{ ...td, fontWeight: 700, color: c.kind === "advance" ? "#d97706" : C.navy }}>{c.kind === "advance" ? "💸 سلفة" : "🧍 عهدة"}</td>
                    <td style={td}>
                      <span onClick={() => { setSettlingId(settlingId === c.id ? null : c.id); setMsg(""); }} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, textDecoration: "underline", textDecorationStyle: "dotted" }}>
                        {c.employeeName}
                      </span>
                    </td>
                    <td style={td}>{treasuryName}</td>
                    <td style={td}>{c.description || "—"}</td>
                    <td style={td}>{fmt(c.amount)}</td>
                    <td style={{ ...td, fontWeight: 700, color: rem > 0 ? C.danger : C.success }}>{fmt(rem)}</td>
                    <td style={{ ...td, color: STATUS_COLOR[status], fontWeight: 700 }}>{STATUS_LABEL[status]}</td>
                    <td style={td}>
                      {(rem > 0 || !canSettle) && (
                        <span onClick={() => { setSettlingId(settlingId === c.id ? null : c.id); setMsg(""); }} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>
                          {settlingId === c.id ? "إغلاق" : (canSettle ? "تسوية" : "مراجعة")}
                        </span>
                      )}
                    </td>
                  </tr>
                  {settlingId === c.id && (
                    <tr>
                      <td colSpan={9} style={{ background: C.blueSoft, padding: 14 }}>
                        {(() => {
                          const custodyLog = expenseLogs[c.id] || [];
                          const selected = selectedExpenseIds[c.id] || {};
                          const selectedCount = custodyLog.filter((e) => selected[e.id]).length;
                          const selectedTotal = custodyLog.filter((e) => selected[e.id]).reduce((s, x) => s + (Number(x.amount) || 0), 0);
                          return custodyLog.length > 0 ? (
                            <div style={{ marginBottom: 14 }}>
                              <div style={{ fontSize: 12.5, fontWeight: 700, color: C.navy, marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                                <span>📋 المصروفات اللي سجّلها الموظف بنفسه ({custodyLog.length}) — إجمالي: {fmt(custodyLog.reduce((s, x) => s + (Number(x.amount) || 0), 0))}</span>
                                {canSettle && (
                                  <span style={{ display: "flex", gap: 10, fontSize: 11.5, fontWeight: 600 }}>
                                    <span onClick={() => toggleAllExpenseSelection(c.id, custodyLog, true)} style={{ cursor: "pointer", color: C.blue }}>تحديد الكل</span>
                                    <span onClick={() => toggleAllExpenseSelection(c.id, custodyLog, false)} style={{ cursor: "pointer", color: C.muted }}>إلغاء التحديد</span>
                                  </span>
                                )}
                              </div>
                              <div style={{ overflowX: "auto" }}>
                                <table style={tblStyle}>
                                  <thead><tr>
                                    {canSettle && <th style={th}></th>}
                                    <th style={th}>التاريخ</th><th style={th}>المورد</th><th style={th}>الفئة</th><th style={th}>البيان</th><th style={th}>المبلغ</th><th style={th}>مرفق</th>
                                  </tr></thead>
                                  <tbody>
                                    {custodyLog.map((e) => (
                                      <tr key={e.id} style={{ background: selected[e.id] ? "#f0fdf4" : undefined }}>
                                        {canSettle && (
                                          <td style={td}>
                                            <input type="checkbox" checked={!!selected[e.id]} onChange={() => toggleExpenseSelection(c.id, e.id)} style={{ width: 16, height: 16, cursor: "pointer" }} />
                                          </td>
                                        )}
                                        <td style={td}>{e.date}</td>
                                        <td style={td}>{e.supplierName || "—"}</td>
                                        <td style={td}>{e.category || "—"}</td>
                                        <td style={td}>{e.description}</td>
                                        <td style={td}>{fmt(e.amount)}</td>
                                        <td style={td}><AttachmentThumb url={e.photoUrl} fileType={e.fileType} size={44} onRemove={e.photoUrl ? () => removeAttachment(c.id, e.id) : null} /></td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                              {canSettle && selectedCount > 0 && (
                                <div style={{ marginTop: 10, fontSize: 12, color: C.navy, fontWeight: 700 }}>
                                  محدَّد: {selectedCount} فاتورة — إجمالي {fmt(selectedTotal)} ر.س
                                </div>
                              )}
                            </div>
                          ) : <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 14 }}>ما فيه مصروفات مسجّلة من الموظف بعد.</div>;
                        })()}
                        {(c.receipts || []).length > 0 && (
                          <div style={{ marginBottom: 14 }}>
                            <div style={{ fontSize: 12.5, fontWeight: 700, color: C.navy, marginBottom: 8 }}>📷 فواتير قديمة رفعها الموظف ({c.receipts.length})</div>
                            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                              {c.receipts.map((r, i) => (
                                <a key={i} href={r.url} target="_blank" rel="noreferrer">
                                  <img src={r.url} alt="فاتورة" style={{ width: 90, height: 90, objectFit: "cover", borderRadius: 8, border: "1px solid " + C.border }} />
                                </a>
                              ))}
                            </div>
                          </div>
                        )}
                        {canSettle && (expenseLogs[c.id] || []).length > 0 && (
                          <div style={{ marginBottom: 12 }}>
                            <button
                              onClick={() => {
                                const custodyLog = expenseLogs[c.id] || [];
                                const selected = selectedExpenseIds[c.id] || {};
                                const chosen = custodyLog.filter((e) => selected[e.id]);
                                if (chosen.length === 0) { setMsg("حدد فاتورة واحدة على الأقل من العلامات ☑ فوق قبل القبول"); return; }
                                const chosenTotal = chosen.reduce((s, x) => s + (Number(x.amount) || 0), 0);
                                const capped = Math.min(chosenTotal, remainingOf(c));
                                setExpensed(capped.toFixed(2));
                                setCashReturned("");
                                setNote("قبول " + chosen.length + " فاتورة محدَّدة بعد المراجعة");
                              }}
                              style={ghostBtn}
                            >
                              ✅ قبول الفواتير المحدَّدة فقط
                            </button>
                            <span style={{ fontSize: 11, color: C.muted, marginRight: 10 }}>حدد ☑ الفواتير اللي تبي تقبلها من الجدول فوق الأول، وبعدين اضغط هنا — بيملأ خانة "مبلغ محوّل لمصروف" بإجمالي المحدَّد بس</span>
                          </div>
                        )}
                        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
                          {canSettle ? (
                            <>
                              <div><label style={smallLabel}>مبلغ مرتجع (كاش/بطاقة)</label><input type="number" step="0.01" value={cashReturned} onChange={(e) => setCashReturned(e.target.value)} style={{ ...inputStyle2, width: 140 }} /></div>
                              <div>
                                <label style={smallLabel}>طريقة السداد</label>
                                <select value={repaymentMethod} onChange={(e) => setRepaymentMethod(e.target.value)} style={inputStyle2}>
                                  <option value="cash">💵 كاش</option>
                                  <option value="card">💳 بطاقة / تحويل بنكي</option>
                                </select>
                              </div>
                              <div><label style={smallLabel}>مبلغ محوّل لمصروف (بإيصالات)</label><input type="number" step="0.01" value={expensed} onChange={(e) => setExpensed(e.target.value)} style={{ ...inputStyle2, width: 160 }} /></div>
                              <div style={{ flex: "1 1 200px" }}><label style={smallLabel}>ملاحظة</label><input value={note} onChange={(e) => setNote(e.target.value)} style={inputStyle2} /></div>
                              <button onClick={() => submitSettlement(c)} style={smallBtn}>حفظ التسوية</button>
                            </>
                          ) : (
                            <div style={{ fontSize: 12, color: C.muted }}>تسوية العهدة (المبلغ المرتجع نقدي/مصروف) متاحة للأدمن والمدير المالي بس — إنت تقدر تراجع الفواتير والمصروفات وتعدّل/تحذف المرفقات.</div>
                          )}
                        </div>
                        {(c.settlements || []).length > 0 && (
                          <div style={{ marginTop: 10, fontSize: 12, color: C.muted }}>
                            سجل التسويات السابقة: {(c.settlements || []).map((s, i) => (
                              <span key={i}>{s.date} ({fmt(s.cashReturned)} {s.repaymentMethod === "card" ? "💳 بطاقة" : s.cashReturned > 0 ? "💵 كاش" : ""} / مصروف {fmt(s.expensed)}){i < c.settlements.length - 1 ? "، " : ""}</span>
                            ))}
                          </div>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
  }

  return (
    <div style={cardStyle}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🧍 عهد الموظفين</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setViewMode("flat")} style={viewMode === "flat" ? smallBtn : ghostBtn}>قائمة مسطحة</button>
          <button onClick={() => setViewMode("grouped")} style={viewMode === "grouped" ? smallBtn : ghostBtn}>مجمّع حسب الموظف</button>
        </div>
      </div>
      <div style={{ height: 14 }} />

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ flex: "1 1 220px" }}>
          <label style={smallLabel}>بحث باسم الموظف</label>
          <input value={searchName} onChange={(e) => setSearchName(e.target.value)} style={inputStyle2} placeholder="اكتب اسم الموظف..." />
        </div>
        <div>
          <label style={smallLabel}>النوع</label>
          <select value={filterKind} onChange={(e) => setFilterKind(e.target.value)} style={inputStyle2}>
            <option value="all">الكل (عهدة وسلفة)</option>
            <option value="custody">عهدة بس</option>
            <option value="advance">سلفة بس</option>
          </select>
        </div>
      </div>

      {searchedEmployeeSummary && (
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          {searchedEmployeeSummary.map((s) => {
            const phone = findUserPhoneByName(users, s.name);
            const link = phone ? whatsappLink(phone, `مرحبًا ${s.name}،\nتذكير بخصوص العهدة/السلفة القائمة عليك بمبلغ ${fmt(s.remaining)} ر.س.\nالرجاء المبادرة بالتسوية أو تسجيل مصروفاتها في التطبيق.\nشكرًا لك.`) : null;
            return (
              <div key={s.name} style={{
                flex: "1 1 220px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "12px 15px"
              }}>
                <div style={{ fontSize: 12, color: "#dbe6ff", marginBottom: 4 }}>المتبقي على "{s.name}" حاليًا ({s.count} عهدة/سلفة)</div>
                <div style={{ fontSize: 22, fontWeight: 800, color: "#fff" }}>{fmt(s.remaining)} ر.س</div>
                <div style={{ fontSize: 11, color: "#dbe6ff", marginTop: 2, marginBottom: 8 }}>من إجمالي مستلم {fmt(s.totalReceived)} ر.س</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span onClick={() => setFullStatementFor(s.name)} style={{
                    display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.18)", color: "#fff",
                    borderRadius: 20, padding: "6px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer"
                  }}>📊 كشف حساب شامل</span>
                  {link && (
                    <a href={link} target="_blank" rel="noreferrer" style={{
                      display: "inline-flex", alignItems: "center", gap: 6, background: "#25D366", color: "#fff",
                      borderRadius: 20, padding: "6px 14px", fontSize: 12.5, fontWeight: 700, textDecoration: "none"
                    }}>📱 راسله على واتساب</a>
                  )}
                </div>
                {!link && (
                  <div style={{ fontSize: 11, color: "#dbe6ff", marginTop: 6 }}>ما فيه رقم جوال مسجّل لهذا الاسم — أضفه من الإعدادات ↦ إدارة المستخدمين</div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[["all", "الكل"], ["outstanding", "قائمة"], ["partial", "جزئية"], ["settled", "مسددة"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilterStatus(k)} style={filterStatus === k ? smallBtn : ghostBtn}>{l}</button>
        ))}
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={tblStyle}>
          <thead><tr><th style={th}>التاريخ</th><th style={th}>النوع</th><th style={th}>الموظف</th><th style={th}>الخزينة</th><th style={th}>البيان</th><th style={th}>المبلغ</th><th style={th}>المتبقي</th><th style={th}>الحالة</th><th style={th}></th></tr></thead>
          <tbody>
            {viewMode === "flat" && filtered.map((c) => renderCustodyRow(c))}
            {viewMode === "flat" && filtered.length === 0 && <tr><td colSpan={9} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد عهد</td></tr>}
            {viewMode === "grouped" && grouped.map((g) => (
              <React.Fragment key={g.name}>
                <tr onClick={() => setExpandedEmployee(expandedEmployee === g.name ? null : g.name)} style={{ cursor: "pointer", background: C.blueSoft }}>
                  <td style={td} colSpan={2}>
                    <span style={{ fontWeight: 800, color: C.navy }}>{expandedEmployee === g.name ? "▾" : "◂"} {g.name}</span>
                  </td>
                  <td style={td}></td>
                  <td style={td}></td>
                  <td style={{ ...td, fontWeight: 700 }}>{g.items.length} عهدة/سلفة</td>
                  <td style={td}>{fmt(g.totalReceived)}</td>
                  <td style={{ ...td, fontWeight: 800, color: g.totalRemaining > 0 ? C.danger : C.success }}>{fmt(g.totalRemaining)}</td>
                  <td style={td}></td>
                  <td style={td}>
                    <span onClick={(e) => { e.stopPropagation(); setFullStatementFor(g.name); }} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, fontSize: 12.5 }}>📊 كشف شامل</span>
                  </td>
                </tr>
                {expandedEmployee === g.name && g.items.map((c) => renderCustodyRow(c))}
              </React.Fragment>
            ))}
            {viewMode === "grouped" && grouped.length === 0 && <tr><td colSpan={9} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد عهد</td></tr>}
          </tbody>
        </table>
      </div>
      {msg && <div style={{ marginTop: 10, fontSize: 13, color: C.danger }}>{msg}</div>}
    </div>
  );
}

function denomLabel(d) {
  if (d >= 1) return d + " ريال";
  return d + " ريال (" + Math.round(d * 100) + " هللة)";
}

function TreasuryCashCount({ currentUser, treasuries, txs, institutionName }) {
  const [treasuryId, setTreasuryId] = useState(treasuries[0]?.id || "");
  const [qty, setQty] = useState({});
  const [note, setNote] = useState("");
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [history, setHistory] = useState([]);

  useEffect(() => {
    if (!treasuryId) return;
    const unsub = CASH_COUNTS_COL.where("treasuryId", "==", treasuryId).orderBy("createdAt", "desc").limit(15).onSnapshot((snap) => {
      setHistory(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, [treasuryId]);

  const treasury = treasuries.find((t) => t.id === treasuryId);
  const bookBalance = treasury ? computeTreasuryBalance(treasury, txs) : 0;

  const totalCounted = useMemo(() => {
    return DENOMINATIONS.reduce((sum, d) => sum + (Number(qty[d]) || 0) * d, 0);
  }, [qty]);

  const difference = totalCounted - bookBalance;

  function setDenomQty(d, val) { setQty((q) => ({ ...q, [d]: val })); }
  function resetForm() { setQty({}); setNote(""); }

  async function saveCount() {
    setSaving(true); setMsg("");
    try {
      const denomBreakdown = {};
      DENOMINATIONS.forEach((d) => { denomBreakdown[d] = Number(qty[d]) || 0; });
      await CASH_COUNTS_COL.add({
        treasuryId, date: todayStr(), denominations: denomBreakdown,
        totalCounted, bookBalance, difference, note,
        countedBy: currentUser.name, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      setMsg("✅ تم حفظ الجرد بنجاح");
      resetForm();
    } catch (e) { setMsg("خطأ: " + e.message); }
    setSaving(false);
  }

  function doPrint() { window.print(); }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>🧮 جرد الخزينة بالفئات</div>
        <div style={{ marginBottom: 14 }}>
          <label style={smallLabel}>الخزينة</label>
          <select value={treasuryId} onChange={(e) => { setTreasuryId(e.target.value); resetForm(); }} style={{ ...inputStyle2, maxWidth: 280 }}>
            {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
      </div>

      <div className="print-area">
        <div className="print-only-header">
          <h2>{institutionName}</h2>
          <div>محضر جرد خزينة: {treasury?.name} — بتاريخ {todayStr()}</div>
        </div>

        <div style={cardStyle}>
          <div style={cardTitle}>💵 عدّ الفئات</div>
          <div style={{ overflowX: "auto" }}>
            <table style={tblStyle}>
              <thead><tr><th style={th}>الفئة</th><th style={th}>العدد</th><th style={th}>الإجمالي</th></tr></thead>
              <tbody>
                {DENOMINATIONS.map((d) => {
                  const q = qty[d] || "";
                  const subtotal = (Number(q) || 0) * d;
                  return (
                    <tr key={d}>
                      <td style={{ ...td, fontWeight: 700 }}>{denomLabel(d)}</td>
                      <td style={td}>
                        <input type="number" min="0" step="1" value={q} onChange={(e) => setDenomQty(d, e.target.value)}
                          style={{ ...inputStyle2, width: 100 }} />
                      </td>
                      <td style={td}>{fmt(subtotal)}</td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ background: C.blueSoft, fontWeight: 800 }}>
                  <td style={td} colSpan={2}>إجمالي المعدود فعليًا</td>
                  <td style={td}>{fmt(totalCounted)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>

        <div style={cardStyle}>
          <div style={cardTitle}>📌 المطابقة مع رصيد النظام</div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <div style={{ flex: "1 1 180px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ fontSize: 12, color: C.muted }}>الرصيد الدفتري (النظام)</div>
              <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(bookBalance)}</div>
            </div>
            <div style={{ flex: "1 1 180px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ fontSize: 12, color: C.muted }}>إجمالي المعدود فعليًا</div>
              <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(totalCounted)}</div>
            </div>
            <div style={{ flex: "1 1 180px", background: "linear-gradient(135deg,#0f2557,#1d4ed8)", borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ fontSize: 12, color: "#dbe6ff" }}>الفرق (عجز/زيادة)</div>
              <div style={{ fontSize: 19, fontWeight: 800, color: "#fff" }}>{fmt(difference)}</div>
            </div>
          </div>
          <div className="no-print" style={{ marginTop: 14 }}>
            <label style={smallLabel}>ملاحظة (اختياري)</label>
            <input value={note} onChange={(e) => setNote(e.target.value)} style={inputStyle2} placeholder="مثال: جرد نهاية اليوم، وجود عجز بسبب..." />
          </div>
          <div className="no-print" style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button onClick={saveCount} disabled={saving} style={{ ...smallBtn, padding: "11px 26px", fontSize: 15 }}>
              {saving ? "جارِ الحفظ..." : "💾 حفظ محضر الجرد"}
            </button>
            <button onClick={doPrint} style={ghostBtn}>🖨️ طباعة / حفظ PDF</button>
          </div>
          {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
        </div>
      </div>

      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>🕒 آخر عمليات الجرد لهذه الخزينة</div>
        <div style={{ overflowX: "auto" }}>
          <table style={tblStyle}>
            <thead><tr><th style={th}>التاريخ</th><th style={th}>بواسطة</th><th style={th}>المعدود</th><th style={th}>الدفتري</th><th style={th}>الفرق</th><th style={th}>ملاحظة</th></tr></thead>
            <tbody>
              {history.map((h) => (
                <tr key={h.id}>
                  <td style={td}>{h.date}</td>
                  <td style={td}>{h.countedBy}</td>
                  <td style={td}>{fmt(h.totalCounted)}</td>
                  <td style={td}>{fmt(h.bookBalance)}</td>
                  <td style={{ ...td, color: h.difference < 0 ? C.danger : (h.difference > 0 ? C.success : C.text), fontWeight: 700 }}>{fmt(h.difference)}</td>
                  <td style={td}>{h.note || "—"}</td>
                </tr>
              ))}
              {history.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد عمليات جرد سابقة</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============ سندات الصرف والقبض القابلة للطباعة ============ */
const VOUCHER_KIND_TITLE = {
  deposit: "سند قبض",
  expense: "سند صرف",
  custody_out: "سند صرف عهدة",
  transfer_out: "سند تحويل بين خزائن",
};

function TreasuryVouchers({ currentUser, treasuries, txs, institutionName, institutionId }) {
  const [treasuryId, setTreasuryId] = useState("all");
  const [typeFilter, setTypeFilter] = useState("all");
  const [fromDate, setFromDate] = useState(firstDayOfMonth());
  const [toDate, setToDate] = useState(todayStr());
  const [selected, setSelected] = useState(null);
  const [loadingVoucherId, setLoadingVoucherId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ amount: "", date: "", description: "", category: "" });
  const [actionMsg, setActionMsg] = useState("");

  const voucherTypes = ["deposit", "expense", "custody_out", "transfer_out"];
  const EDITABLE_TYPES = ["deposit", "expense", "transfer_out"];
  const rows = useMemo(() => {
    return txs
      .filter((t) => voucherTypes.includes(t.type))
      .filter((t) => treasuryId === "all" || t.treasuryId === treasuryId)
      .filter((t) => typeFilter === "all" || t.type === typeFilter)
      .filter((t) => t.date >= fromDate && t.date <= toDate)
      .sort((a, b) => b.date.localeCompare(a.date));
  }, [txs, treasuryId, typeFilter, fromDate, toDate]);

  async function openVoucher(t) {
    setLoadingVoucherId(t.id);
    setActionMsg("");
    try {
      const voucherNo = await assignVoucherNoIfMissing(t, institutionId);
      setSelected({ ...t, voucherNo });
    } catch (e) {
      setActionMsg("⚠️ تعذر تجهيز السند: " + e.message);
    }
    setLoadingVoucherId(null);
  }

  function doPrint() { window.print(); }

  function startEdit(t) {
    setActionMsg("");
    setEditingId(t.id);
    setEditForm({ amount: t.amount, date: t.date, description: t.description || "", category: t.category || "" });
  }
  function cancelEdit() { setEditingId(null); }

  async function saveEdit(t) {
    const amt = Number(editForm.amount);
    if (!amt || amt <= 0) { setActionMsg("أدخل مبلغ صحيح أكبر من صفر"); return; }
    try {
      const updates = { amount: amt, date: editForm.date, description: editForm.description };
      if (t.type === "deposit" || t.type === "expense") updates.category = editForm.category || "";
      await TREASURY_TX_COL.doc(t.id).update(updates);
      if (t.type === "transfer_out") {
        const sibling = txs.find((x) => x.transferGroupId === t.transferGroupId && x.id !== t.id);
        if (sibling) await TREASURY_TX_COL.doc(sibling.id).update({ amount: amt, date: editForm.date, description: editForm.description });
      }
      setEditingId(null);
      setActionMsg("");
      if (selected && selected.id === t.id) setSelected(null);
    } catch (e) { setActionMsg("خطأ: " + e.message); }
  }

  async function deleteVoucher(t) {
    if (t.type === "custody_out") {
      const snap = await CUSTODIES_COL.doc(t.custodyId).get().catch(() => null);
      const hasSettlements = snap && snap.exists && (snap.data().settlements || []).length > 0;
      if (hasSettlements) {
        alert('لا يمكن حذف سند العهدة لأن عليها تسويات مسجلة بالفعل. راجعها من قسم "عهد الموظفين" أولاً.');
        return;
      }
      if (!confirm("سيتم حذف العهدة بالكامل مع سندها. هل تريد المتابعة؟")) return;
      await TREASURY_TX_COL.doc(t.id).delete();
      if (t.custodyId) await CUSTODIES_COL.doc(t.custodyId).delete().catch(() => {});
    } else if (t.type === "transfer_out") {
      if (!confirm("سند التحويل مرتبط بخزينتين — سيتم حذف الطرفين (الصادر والوارد) معًا. هل تريد المتابعة؟")) return;
      const sibling = txs.find((x) => x.transferGroupId === t.transferGroupId && x.id !== t.id);
      await TREASURY_TX_COL.doc(t.id).delete();
      if (sibling) await TREASURY_TX_COL.doc(sibling.id).delete();
    } else {
      if (!confirm("هل تريد حذف هذا السند؟")) return;
      await TREASURY_TX_COL.doc(t.id).delete();
    }
    if (selected && selected.id === t.id) setSelected(null);
  }

  return (
    <div>
      <div style={cardStyle} className="no-print">
        <div style={cardTitle}>🧾 طباعة سندات الصرف والقبض</div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 4 }}>
          <div>
            <label style={smallLabel}>الخزينة</label>
            <select value={treasuryId} onChange={(e) => setTreasuryId(e.target.value)} style={inputStyle2}>
              <option value="all">كل الخزائن</option>
              {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div>
            <label style={smallLabel}>نوع السند</label>
            <select value={typeFilter} onChange={(e) => setTypeFilter(e.target.value)} style={inputStyle2}>
              <option value="all">الكل</option>
              <option value="deposit">سند قبض</option>
              <option value="expense">سند صرف</option>
              <option value="custody_out">سند صرف عهدة</option>
              <option value="transfer_out">سند تحويل</option>
            </select>
          </div>
          <div><label style={smallLabel}>من تاريخ</label><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} style={inputStyle2} /></div>
          <div><label style={smallLabel}>إلى تاريخ</label><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} style={inputStyle2} /></div>
        </div>
        {actionMsg && <div style={{ color: C.danger, fontSize: 13, marginTop: 6 }}>{actionMsg}</div>}
        <div style={{ overflowX: "auto", marginTop: 12 }}>
          <table style={tblStyle}>
            <thead><tr><th style={th}>التاريخ</th><th style={th}>النوع</th><th style={th}>الخزينة</th><th style={th}>البيان</th><th style={th}>المبلغ</th><th style={th}></th></tr></thead>
            <tbody>
              {rows.map((r) => (
                <React.Fragment key={r.id}>
                  <tr>
                    <td style={td}>{r.date}</td>
                    <td style={td}>{VOUCHER_KIND_TITLE[r.type]}</td>
                    <td style={td}>{treasuries.find((t) => t.id === r.treasuryId)?.name || "—"}</td>
                    <td style={td}>{r.description || (r.employeeName ? "عهدة: " + r.employeeName : "—")}</td>
                    <td style={td}>{fmt(r.amount)}</td>
                    <td style={td}>
                      <span onClick={() => openVoucher(r)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, marginLeft: 10 }}>
                        {loadingVoucherId === r.id ? "جارِ التجهيز..." : "عرض/طباعة"}
                      </span>
                      {EDITABLE_TYPES.includes(r.type) && (
                        <span onClick={() => (editingId === r.id ? cancelEdit() : startEdit(r))} style={{ cursor: "pointer", color: "#d97706", fontWeight: 700, marginLeft: 10 }}>
                          {editingId === r.id ? "إلغاء" : "تعديل"}
                        </span>
                      )}
                      <span onClick={() => deleteVoucher(r)} style={{ cursor: "pointer", color: C.danger, fontWeight: 700 }}>حذف</span>
                    </td>
                  </tr>
                  {editingId === r.id && (
                    <tr>
                      <td colSpan={6} style={{ background: C.blueSoft, padding: 14 }}>
                        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
                          <div><label style={smallLabel}>المبلغ</label><input type="number" step="0.01" value={editForm.amount} onChange={(e) => setEditForm((f) => ({ ...f, amount: e.target.value }))} style={{ ...inputStyle2, width: 130 }} /></div>
                          <div><label style={smallLabel}>التاريخ</label><input type="date" value={editForm.date} onChange={(e) => setEditForm((f) => ({ ...f, date: e.target.value }))} style={inputStyle2} /></div>
                          {(r.type === "deposit" || r.type === "expense") && (
                            <div>
                              <label style={smallLabel}>الفئة</label>
                              <select value={editForm.category} onChange={(e) => setEditForm((f) => ({ ...f, category: e.target.value }))} style={inputStyle2}>
                                <option value="">بدون تصنيف</option>
                                {TX_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                              </select>
                            </div>
                          )}
                          <div style={{ flex: "1 1 200px" }}><label style={smallLabel}>البيان</label><input value={editForm.description} onChange={(e) => setEditForm((f) => ({ ...f, description: e.target.value }))} style={inputStyle2} /></div>
                          <button onClick={() => saveEdit(r)} style={smallBtn}>حفظ التعديل</button>
                        </div>
                        {r.type === "transfer_out" && (
                          <div style={{ fontSize: 11.5, color: C.muted, marginTop: 8 }}>ملحوظة: التعديل هيتزامن تلقائيًا مع سند التحويل الوارد في الخزينة الوجهة.</div>
                        )}
                        {r.voucherNo && (
                          <div style={{ fontSize: 11.5, color: C.muted, marginTop: 4 }}>رقم السند ({r.voucherNo}) هيفضل ثابت بعد التعديل.</div>
                        )}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
              {rows.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>لا يوجد حركات في هذه الفترة</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {selected && (
        <VoucherPrintView voucher={selected} treasuries={treasuries} onPrint={doPrint} onClose={() => setSelected(null)} institutionName={institutionName} />
      )}
    </div>
  );
}

/* ============ اعتماد طلبات الصرف (مدير مالي/أدمن) ============ */
function TreasuryApprovals({ currentUser, treasuries, institutionId, institutionName }) {
  const [requests, setRequests] = useState([]);
  const [filterStatus, setFilterStatus] = useState("pending");
  const [reviewingId, setReviewingId] = useState(null);
  const [reviewNote, setReviewNote] = useState("");
  const [busy, setBusy] = useState(null);
  const [msg, setMsg] = useState("");
  const [approvedVoucher, setApprovedVoucher] = useState(null);

  useEffect(() => {
    const unsub = EXPENSE_REQUESTS_COL.orderBy("createdAt", "desc").limit(200).onSnapshot((snap) => {
      let data = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      data = data.filter((r) => (r.institutionId || DEFAULT_INSTITUTION_ID) === institutionId);
      setRequests(data);
    });
    return unsub;
  }, [institutionId]);

  const filtered = requests.filter((r) => filterStatus === "all" || r.status === filterStatus);
  const pendingCount = requests.filter((r) => r.status === "pending").length;

  async function approve(r) {
    setBusy(r.id); setMsg("");
    try {
      const txPayload = {
        treasuryId: r.treasuryId, type: "expense", amount: r.amount, date: r.date,
        description: r.description + " (طلب صرف #" + r.id.slice(0, 6) + " — مقدَّم من " + r.requestedBy + ")",
        category: r.category || "", institutionId,
        enteredBy: currentUser.name, enteredByRole: currentUser.role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      const txRef = await TREASURY_TX_COL.add(txPayload);
      await EXPENSE_REQUESTS_COL.doc(r.id).update({
        status: "approved", reviewedBy: currentUser.name, reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
        reviewNote: reviewNote || "", txId: txRef.id,
      });
      setReviewingId(null); setReviewNote("");
      setMsg("✅ تم اعتماد الطلب وتنفيذ الصرف في الخزينة — السند جاهز تحت للطباعة");
      // نجهّز رقم السند فورًا ونعرضه جاهز للطباعة/تحميل PDF من غير ما يدوّر عليه في مكان تاني
      const voucherNo = await assignVoucherNoIfMissing({ id: txRef.id, type: "expense" }, institutionId);
      setApprovedVoucher({ id: txRef.id, ...txPayload, voucherNo });
    } catch (e) { setMsg("خطأ: " + e.message); }
    setBusy(null);
  }

  async function reject(r) {
    if (!reviewNote.trim()) { setMsg("من فضلك اكتب سبب الرفض قبل التأكيد"); return; }
    setBusy(r.id); setMsg("");
    try {
      await EXPENSE_REQUESTS_COL.doc(r.id).update({
        status: "rejected", reviewedBy: currentUser.name, reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
        reviewNote: reviewNote,
      });
      setReviewingId(null); setReviewNote("");
      setMsg("تم رفض الطلب");
    } catch (e) { setMsg("خطأ: " + e.message); }
    setBusy(null);
  }

  function doPrint() { window.print(); }

  return (

/* ============ شجرة الفروع: هرمية بمستويات غير محدودة، طبقة تنظيمية فوق الفروع التشغيلية الحالية ============
   meta.branchTree = [{ id, name, parentId (null = جذر), branchName (لو موجودة = عقدة ورقة تمثّل فرع تشغيلي حقيقي) }]
   الفروع التشغيلية (meta.branches) بتفضل زي ما هي بالظبط — الشجرة دي بس لتنظيم/تجميع التقارير */
function buildTreeChildren(nodes, parentId) {
  return nodes.filter((n) => (n.parentId || null) === (parentId || null));
}
function collectDescendantBranchNames(nodeId, nodes) {
  const node = nodes.find((n) => n.id === nodeId);
  if (!node) return [];
  let names = node.branchName ? [node.branchName] : [];
  buildTreeChildren(nodes, nodeId).forEach((child) => { names = names.concat(collectDescendantBranchNames(child.id, nodes)); });
  return Array.from(new Set(names));
}

function BranchTreeSettings({ meta, institutionId }) {
  const tree = meta.branchTree || [];
  const [addingUnder, setAddingUnder] = useState(null); // parentId (or "root")
  const [newName, setNewName] = useState("");
  const [attachBranch, setAttachBranch] = useState("");
  const [msg, setMsg] = useState("");

  const placedBranchNames = new Set(tree.filter((n) => n.branchName).map((n) => n.branchName));
  const unplacedBranches = meta.branches.filter((b) => !placedBranchNames.has(b));

  async function addContainer(parentId) {
    const name = newName.trim();
    if (!name) { setMsg("اكتب اسم للعقدة"); return; }
    const updated = [...tree, { id: uid(), name, parentId: parentId === "root" ? null : parentId, branchName: null }];
    await instMetaDoc(institutionId).update({ branchTree: updated });
    setNewName(""); setAddingUnder(null); setMsg("");
  }

  async function attachLeaf(parentId) {
    if (!attachBranch) { setMsg("اختر فرع لإضافته"); return; }
    const updated = [...tree, { id: uid(), name: attachBranch, parentId: parentId === "root" ? null : parentId, branchName: attachBranch }];
    await instMetaDoc(institutionId).update({ branchTree: updated });
    setAttachBranch(""); setAddingUnder(null); setMsg("");
  }

  async function removeNode(id) {
    const descendants = collectAllDescendantIds(id, tree);
    const msg2 = descendants.length > 0
      ? `هذه العقدة فيها ${descendants.length} عنصر فرعي جواها، وهيتحذفوا كلهم من الشجرة (الفروع التشغيلية نفسها مش هتتحذف، بس هتبقى غير مصنّفة). متأكد؟`
      : "تحذف هذه العقدة من الشجرة؟";
    if (!confirm(msg2)) return;
    const toRemove = new Set([id, ...descendants]);
    const updated = tree.filter((n) => !toRemove.has(n.id));
    await instMetaDoc(institutionId).update({ branchTree: updated });
  }

  function collectAllDescendantIds(nodeId, nodes) {
    let ids = [];
    buildTreeChildren(nodes, nodeId).forEach((c) => { ids.push(c.id); ids = ids.concat(collectAllDescendantIds(c.id, nodes)); });
    return ids;
  }

  function TreeNode({ node, depth }) {
    const children = buildTreeChildren(tree, node.id);
    const isAdding = addingUnder === node.id;
    return (
      <div style={{ marginRight: depth * 22, marginBottom: 6 }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 8, padding: "7px 12px", borderRadius: 8,
          background: node.branchName ? C.blueSoft : "#fff", border: "1px solid " + C.border
        }}>
          <span style={{ fontSize: 13 }}>{node.branchName ? "🏬" : "🗂️"}</span>
          <span style={{ fontWeight: node.branchName ? 600 : 800, color: node.branchName ? C.text : C.navy, fontSize: 13.5 }}>{node.name}</span>
          {!node.branchName && (
            <span onClick={() => { setAddingUnder(isAdding ? null : node.id); setMsg(""); }} style={{ cursor: "pointer", color: C.blue, fontSize: 12, fontWeight: 700, marginRight: "auto" }}>
              {isAdding ? "إغلاق" : "+ إضافة تحتها"}
            </span>
          )}
          <span onClick={() => removeNode(node.id)} style={{ cursor: "pointer", color: C.danger, fontSize: 12, fontWeight: 700, marginRight: node.branchName ? "auto" : 10 }}>حذف</span>
        </div>
        {isAdding && (
          <div style={{ marginRight: 22, marginTop: 8, background: C.blueSoft, borderRadius: 8, padding: 12 }}>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 8 }}>
              <div>
                <label style={smallLabel}>إضافة مجموعة فرعية جديدة</label>
                <input value={newName} onChange={(e) => setNewName(e.target.value)} style={inputStyle2} placeholder="مثال: مستقبل الاقتصاد - ينبع" />
              </div>
              <button onClick={() => addContainer(node.id)} style={smallBtn}>➕ إضافة</button>
            </div>
            {unplacedBranches.length > 0 && (
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
                <div>
                  <label style={smallLabel}>أو أرفق فرع تشغيلي موجود</label>
                  <select value={attachBranch} onChange={(e) => setAttachBranch(e.target.value)} style={inputStyle2}>
                    <option value="">اختر فرع</option>
                    {unplacedBranches.map((b) => <option key={b} value={b}>{b}</option>)}
                  </select>
                </div>
                <button onClick={() => attachLeaf(node.id)} style={ghostBtn}>🏬 إرفاق</button>
              </div>
            )}
          </div>
        )}
        {children.map((c) => <TreeNode key={c.id} node={c} depth={depth + 1} />)}
      </div>
    );
  }

  const roots = buildTreeChildren(tree, null);
  const isAddingRoot = addingUnder === "root";

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>🌳 شجرة الفروع (هيكل تنظيمي بمستويات غير محدودة)</div>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
        نظّم فروعك في هرمية حرة — مجموعة رئيسية تحتها مجموعات فرعية بلا حدود، وفي أي مستوى تقدر تربط فرع تشغيلي حقيقي (اللي شغال بيه في تسجيل الورديات والخزينة). هذا التنظيم للتقارير والعرض بس، وما يأثر على شغل الفروع الفعلي.
      </div>

      {msg && <div style={{ color: C.danger, fontSize: 13, marginBottom: 10 }}>{msg}</div>}

      {roots.map((n) => <TreeNode key={n.id} node={n} depth={0} />)}
      {roots.length === 0 && !isAddingRoot && <div style={{ color: "#9ca3af", fontSize: 13, marginBottom: 10 }}>ما فيه هيكل بعد — ابدأ بإضافة أول مجموعة رئيسية</div>}

      <div style={{ marginTop: 12 }}>
        {isAddingRoot ? (
          <div style={{ background: C.blueSoft, borderRadius: 8, padding: 12 }}>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
              <div><label style={smallLabel}>اسم المجموعة الرئيسية</label><input value={newName} onChange={(e) => setNewName(e.target.value)} style={inputStyle2} placeholder="مثال: شركة مستقبل الاقتصاد" /></div>
              <button onClick={() => addContainer("root")} style={smallBtn}>➕ إضافة</button>
              <button onClick={() => setAddingUnder(null)} style={ghostBtn}>إلغاء</button>
            </div>
          </div>
        ) : (
          <button onClick={() => setAddingUnder("root")} style={smallBtn}>➕ إضافة مجموعة رئيسية جديدة</button>
        )}
      </div>

      {unplacedBranches.length > 0 && (
        <div style={{ marginTop: 16, fontSize: 12.5, color: C.muted }}>
          فروع تشغيلية لسه غير مصنّفة في الشجرة: {unplacedBranches.join("، ")}
        </div>
      )}
    </div>
  );
}

function SectionsSettings({ meta, institutionId }) {
  const sections = meta.sections || [];
  const [newSectionName, setNewSectionName] = useState("");
  const [msg, setMsg] = useState("");

  const assignedBranches = new Set(sections.flatMap((s) => s.branches || []));
  const unassignedBranches = meta.branches.filter((b) => !assignedBranches.has(b));

  async function addSection() {
    const name = newSectionName.trim();
    if (!name) return;
    if (sections.some((s) => s.name === name)) { setMsg("يوجد قسم بنفس الاسم بالفعل"); return; }
    const updated = [...sections, { id: uid(), name, branches: [] }];
    await instMetaDoc(institutionId).update({ sections: updated });
    setNewSectionName("");
    setMsg("");
  }

  async function removeSection(id) {
    if (!confirm("هل تريد حذف هذا القسم؟ الفروع التابعة له هترجع بدون قسم.")) return;
    await instMetaDoc(institutionId).update({ sections: sections.filter((s) => s.id !== id) });
  }

  async function addBranchToSection(sectionId, branch) {
    if (!branch) return;
    const updated = sections.map((s) => {
      if (s.id === sectionId) return { ...s, branches: [...(s.branches || []), branch] };
      return { ...s, branches: (s.branches || []).filter((b) => b !== branch) };
    });
    await instMetaDoc(institutionId).update({ sections: updated });
  }

  async function removeBranchFromSection(sectionId, branch) {
    const updated = sections.map((s) => s.id === sectionId ? { ...s, branches: (s.branches || []).filter((b) => b !== branch) } : s);
    await instMetaDoc(institutionId).update({ sections: updated });
  }

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>🗺️ الأقسام الإدارية (مجموعات فروع)</div>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
        قسّم فروعك لمجموعات إدارية (قطاعات/مناطق) عشان تقدر تشوف تقارير مجمّعة لكل قسم بدل فرع لوحده — كل فرع يتبع قسم واحد بس.
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
        <input value={newSectionName} onChange={(e) => setNewSectionName(e.target.value)} placeholder="اسم القسم الجديد (مثال: قطاع الشمال)" style={{ ...inputStyle2, maxWidth: 280 }} />
        <button onClick={addSection} style={smallBtn}>➕ إضافة قسم</button>
      </div>
      {msg && <div style={{ color: C.danger, fontSize: 13, marginBottom: 12 }}>{msg}</div>}

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {sections.map((s) => (
          <div key={s.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontWeight: 800, color: C.navy, fontSize: 14 }}>{s.name}</div>
              <span onClick={() => removeSection(s.id)} style={{ cursor: "pointer", color: C.danger, fontSize: 12.5, fontWeight: 700 }}>حذف القسم</span>
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
              {(s.branches || []).map((b) => (
                <div key={b} style={{ background: C.blueSoft, borderRadius: 20, padding: "5px 11px", fontSize: 12.5, display: "flex", alignItems: "center", gap: 6, color: C.navy, fontWeight: 600 }}>
                  {b}<span onClick={() => removeBranchFromSection(s.id, b)} style={{ cursor: "pointer", color: C.danger, fontWeight: 800 }}>×</span>
                </div>
              ))}
              {(s.branches || []).length === 0 && <span style={{ color: "#9ca3af", fontSize: 12.5 }}>لا يوجد فروع في هذا القسم بعد</span>}
            </div>
            {unassignedBranches.length > 0 && (
              <select onChange={(e) => { addBranchToSection(s.id, e.target.value); e.target.value = ""; }} defaultValue="" style={{ ...inputStyle2, maxWidth: 220 }}>
                <option value="" disabled>+ إضافة فرع لهذا القسم</option>
                {unassignedBranches.map((b) => <option key={b} value={b}>{b}</option>)}
              </select>
            )}
          </div>
        ))}
        {sections.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13 }}>لا يوجد أقسام بعد — أضف أول قسم من فوق</div>}
      </div>

      {unassignedBranches.length > 0 && sections.length > 0 && (
        <div style={{ marginTop: 14, fontSize: 12.5, color: C.muted }}>
          فروع بدون قسم حاليًا: {unassignedBranches.join("، ")}
        </div>
      )}
    </div>
  );
}

function ReceiptNumberingSettings({ meta, institutionId }) {
  const [counters, setCounters] = useState(null);
  const [edits, setEdits] = useState({});
  const [msg, setMsg] = useState("");

  useEffect(() => {
    const unsub = instMetaDoc(institutionId).onSnapshot((doc) => {
      setCounters((doc.exists && doc.data().branchCounters) || {});
    });
    return unsub;
  }, [institutionId]);

  if (counters === null) return null;

  function setEdit(branch, val) { setEdits((e) => ({ ...e, [branch]: val })); }

  async function saveBranch(branch) {
    const val = edits[branch];
    if (val === undefined || val === "") return;
    const n = Math.max(0, parseInt(val, 10) || 0);
    await instMetaDoc(institutionId).set({ branchCounters: { ...counters, [branch]: n } }, { merge: true });
    setEdit(branch, undefined);
    setMsg("✅ تم تحديث ترقيم فرع " + branch + " — أول سند جديد هيبقى رقم " + padReceiptNo(n + 1));
  }

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>🧾 ترقيم السندات</div>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
        كل فرع له ترقيم تسلسلي منفصل يبدأ تلقائيًا من 00001 ويزيد وحدة مع كل وردية جديدة. لو عندك أرقام سابقة من دفاتر سندات ورقية وعايز تكمّل منها، حدد "آخر رقم مستخدم" لكل فرع تحت وهنكمل من بعده.
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={tblStyle}>
          <thead><tr><th style={th}>الفرع</th><th style={th}>آخر رقم مستخدم</th><th style={th}>الرقم التالي المتوقع</th><th style={th}>تعديل آخر رقم مستخدم</th><th style={th}></th></tr></thead>
          <tbody>
            {meta.branches.map((b) => {
              const current = Number(counters[b]) || 0;
              return (
                <tr key={b}>
                  <td style={td}>{b}</td>
                  <td style={td}>{padReceiptNo(current)}</td>
                  <td style={{ ...td, fontWeight: 700, color: C.blue }}>{padReceiptNo(current + 1)}</td>
                  <td style={td}>
                    <input type="number" min="0" placeholder={String(current)} value={edits[b] ?? ""} onChange={(e) => setEdit(b, e.target.value)} style={{ ...inputStyle2, width: 110 }} />
                  </td>
                  <td style={td}><span onClick={() => saveBranch(b)} style={{ cursor: "pointer", color: C.blue, fontWeight: 700 }}>حفظ</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {msg && <div style={{ marginTop: 10, fontSize: 13, color: C.success }}>{msg}</div>}
    </div>
  );
}

function NotificationSettings({ meta, institutionId }) {
  const [val, setVal] = useState(meta.shortageThreshold || DEFAULT_SHORTAGE_THRESHOLD);
  const [msg, setMsg] = useState("");

  async function saveThreshold() {
    const n = Number(val);
    if (!n || n <= 0) { setMsg("أدخل رقم أكبر من صفر"); return; }
    await instMetaDoc(institutionId).update({ shortageThreshold: n });
    setMsg("✅ تم الحفظ — أي وردية عجزها أو زيادتها ≥ " + n + " ر.س هتولّد تنبيه");
  }

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>🔔 إعدادات الإشعارات</div>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
        حدد الحد الأدنى لمبلغ العجز أو الزيادة (بالريال) اللي لو أي وردية وصلت له، هيظهر تنبيه تلقائي فوق في الجرس 🔔 للأدمن والمحاسب، ومدير الفرع المعني، والكاشير صاحب الوردية.

      {msg && <div style={{ marginTop: 8, fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}

  );
}

/* ============ صلاحيات الأدوار: تحكم من الإعدادات في وصول كل دور لكل تبويب ============ */
function RolePermissionsSettings({ meta, institutionId }) {
  const effectivePerms = { ...DEFAULT_TAB_PERMISSIONS, ...(meta.tabPermissions || {}) };
  const [msg, setMsg] = useState("");

  async function toggle(tabId, role) {
    const current = effectivePerms[tabId] || [];
    const updated = current.includes(role) ? current.filter((r) => r !== role) : [...current, role];
    const newPerms = { ...(meta.tabPermissions || {}), [tabId]: updated };
    await instMetaDoc(institutionId).update({ tabPermissions: newPerms });
    setMsg("");
  }

  async function resetDefaults() {
    if (!confirm("ترجع كل الصلاحيات للإعدادات الافتراضية؟")) return;
    await instMetaDoc(institutionId).update({ tabPermissions: {} });
    setMsg("✅ رجعت الصلاحيات للوضع الافتراضي");
  }

  const configurableTabs = TAB_DEFS.filter((t) => t.id !== "settings");

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>🔐 صلاحيات الأدوار (من يشوف إيش)</div>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>

        ⚠️ تبويب "الخزينة" حساس ماليًا — امنح الوصول له بحذر.
      </div>
      {msg && <div style={{ fontSize: 13, color: C.success, marginBottom: 10 }}>{msg}</div>}

        <table style={tblStyle}>

              {CONFIGURABLE_ROLES.map((r) => <th key={r} style={th}>{ROLE_LABELS[r]}</th>)}
            </tr>
          </thead>
          <tbody>
            {configurableTabs.map((t) => (
              <tr key={t.id}>
                <td style={{ ...td, fontWeight: 700 }}>{t.label}</td>
                {CONFIGURABLE_ROLES.map((r) => (
                  <td key={r} style={{ ...td, textAlign: "center" }}>
                    <input type="checkbox" checked={(effectivePerms[t.id] || []).includes(r)} onChange={() => toggle(t.id, r)} style={{ width: 17, height: 17, cursor: "pointer" }} />

  );
}

function UsersSettings({ users, allUsers, meta, institutionId }) {
  /* -------- إضافة جماعية سريعة -------- */
  const [bulkRows, setBulkRows] = useState([emptyBulkRow(), emptyBulkRow(), emptyBulkRow()]);
  const [bulkMsg, setBulkMsg] = useState("");

  function setBulkField(rid, key, val) {
    setBulkRows((rows) => rows.map((r) => (r._rid === rid ? { ...r, [key]: val } : r)));
  }
  function addBulkRow() { setBulkRows((rows) => [...rows, emptyBulkRow()]); }
  function removeBulkRow(rid) { setBulkRows((rows) => rows.filter((r) => r._rid !== rid)); }

  async function saveBulk() {
    const valid = bulkRows.filter((r) => r.username.trim() && r.password.trim() && r.name.trim());
    if (valid.length === 0) { setBulkMsg("من فضلك أدخل بيانات مستخدم واحد على الأقل (اسم مستخدم + كلمة مرور + اسم)"); return; }
    const existingUsernames = new Set(allUsers.map((u) => u.username));
    const seenNow = new Set();
    const toAdd = [];
    for (const r of valid) {
      const uname = r.username.trim();
      if (existingUsernames.has(uname) || seenNow.has(uname)) continue;
      seenNow.add(uname);
      toAdd.push({
        id: uid(), username: uname, password: r.password.trim(), name: r.name.trim(), role: r.role,
        branch: "",
        branches: (r.role === "cashier" || r.role === "branch_manager") && r.branch ? [r.branch] : [],
        institutionId,
      });
    }
    if (toAdd.length === 0) { setBulkMsg("كل أسماء المستخدمين المدخلة موجودة بالفعل"); return; }
    await USERS_DOC.set({ list: [...allUsers, ...toAdd] });
    setBulkRows([emptyBulkRow(), emptyBulkRow(), emptyBulkRow()]);
    setBulkMsg("✅ تمت إضافة " + toAdd.length + " مستخدم بنجاح — لو أي حد محتاج أكتر من فرع، عدّله من الجدول تحت وأضف باقي الفروع");
  }

  /* -------- تعديل مستخدم موجود -------- */
  const [form, setForm] = useState(emptyUser);
  const [editingId, setEditingId] = useState(null);
  const [msg, setMsg] = useState("");

  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }

  async function saveUser() {
    if (!form.username.trim() || !form.password.trim() || !form.name.trim()) { setMsg("من فضلك أكمل اسم المستخدم وكلمة المرور والاسم"); return; }
    if (isMultiBranchRole && (!form.branches || form.branches.length === 0)) { setMsg("اختر فرع واحد على الأقل"); return; }
    const payload = { ...form };
    if (isMultiBranchRole) { payload.branch = ""; payload.branches = form.branches || []; }
    else { payload.branches = []; }
    const list = allUsers.slice();
    if (editingId) {
      const idx = list.findIndex((u) => u.id === editingId);
      if (idx > -1) list[idx] = { ...list[idx], ...payload, institutionId };
    } else {
      if (list.some((u) => u.username === payload.username.trim())) { setMsg("اسم المستخدم موجود بالفعل"); return; }
      list.push({ id: uid(), ...payload, institutionId });
    }
    await USERS_DOC.set({ list });
    setForm(emptyUser); setEditingId(null); setMsg("");
  }
  function editUser(u) {
    setForm({ username: u.username, password: u.password, name: u.name, role: u.role, branch: u.branch || "", branches: userBranches(u), phone: u.phone || "", email: u.email || "" });
    setEditingId(u.id);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
  async function removeUser(id) {
    if (!confirm("هل تريد حذف هذا المستخدم؟")) return;
    await USERS_DOC.set({ list: allUsers.filter((u) => u.id !== id) });
  }

  const needsBranch = form.role === "branch_manager" || form.role === "cashier";
  const isMultiBranchRole = form.role === "cashier" || form.role === "branch_manager";
  function toggleFormBranch(b) {
    setForm((f) => {
      const cur = f.branches || [];
      const next = cur.includes(b) ? cur.filter((x) => x !== b) : [...cur, b];
      return { ...f, branches: next };
    });
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>👥 إضافة مستخدمين جماعيًا</div>
        <div style={{ overflowX: "auto" }}>
          <table style={tblStyle}>
            <thead><tr>
              <th style={th}>اسم المستخدم</th><th style={th}>كلمة المرور</th><th style={th}>الاسم</th>
              <th style={th}>الصلاحية</th><th style={th}>الفرع</th><th style={th}></th>
            </tr></thead>
            <tbody>
              {bulkRows.map((r) => {
                const rowNeedsBranch = r.role === "branch_manager" || r.role === "cashier";
                return (
                  <tr key={r._rid}>
                    <td style={td}><input value={r.username} onChange={(e) => setBulkField(r._rid, "username", e.target.value)} style={{ ...inputStyle2, minWidth: 110 }} /></td>
                    <td style={td}><input value={r.password} onChange={(e) => setBulkField(r._rid, "password", e.target.value)} style={{ ...inputStyle2, minWidth: 100 }} /></td>
                    <td style={td}><input value={r.name} onChange={(e) => setBulkField(r._rid, "name", e.target.value)} style={{ ...inputStyle2, minWidth: 130 }} /></td>
                    <td style={td}>
                      <select value={r.role} onChange={(e) => setBulkField(r._rid, "role", e.target.value)} style={{ ...inputStyle2, minWidth: 110 }}>
                        <option value="admin">أدمن</option>
                        <option value="financial_manager">مدير مالي</option>
                        <option value="accountant">محاسب</option>
                        <option value="branch_manager">مدير فرع</option>
                        <option value="cashier">كاشير</option>
                        <option value="custody_holder">أمين عهدة</option>
                      </select>
                    </td>
                    <td style={td}>
                      {rowNeedsBranch ? (
                        <select value={r.branch} onChange={(e) => setBulkField(r._rid, "branch", e.target.value)} style={{ ...inputStyle2, minWidth: 110 }}>
                          <option value="">اختر فرع</option>
                          {meta.branches.map((b) => <option key={b} value={b}>{b}</option>)}
                        </select>
                      ) : <span style={{ color: "#9ca3af" }}>—</span>}
                    </td>
                    <td style={td}><span onClick={() => removeBulkRow(r._rid)} style={{ cursor: "pointer", color: C.danger }}>حذف الصف</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 12 }}>
          <button onClick={addBulkRow} style={ghostBtn}>+ إضافة صف</button>
          <button onClick={saveBulk} style={smallBtn}>💾 حفظ كل المستخدمين</button>
          {bulkMsg && <span style={{ fontSize: 13, color: bulkMsg.startsWith("✅") ? C.success : C.danger }}>{bulkMsg}</span>}
        </div>
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>{editingId ? "✏️ تعديل مستخدم" : "➕ إضافة مستخدم مفرد"}</div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
          <div style={{ flex: "1 1 150px" }}><label style={smallLabel}>اسم المستخدم (دخول)</label><input value={form.username} onChange={(e) => set("username", e.target.value)} style={inputStyle2} /></div>
          <div style={{ flex: "1 1 150px" }}><label style={smallLabel}>كلمة المرور</label><input value={form.password} onChange={(e) => set("password", e.target.value)} style={inputStyle2} /></div>
          <div style={{ flex: "1 1 150px" }}><label style={smallLabel}>الاسم الظاهر</label><input value={form.name} onChange={(e) => set("name", e.target.value)} style={inputStyle2} /></div>
          <div style={{ flex: "1 1 150px" }}><label style={smallLabel}>رقم الجوال (واتساب)</label><input value={form.phone} onChange={(e) => set("phone", e.target.value)} style={inputStyle2} placeholder="05xxxxxxxx" /></div>
          <div style={{ flex: "1 1 170px" }}><label style={smallLabel}>البريد الإلكتروني</label><input type="email" value={form.email} onChange={(e) => set("email", e.target.value)} style={inputStyle2} placeholder="name@example.com" /></div>
          <div style={{ flex: "1 1 150px" }}>
            <label style={smallLabel}>الصلاحية</label>
            <select value={form.role} onChange={(e) => set("role", e.target.value)} style={inputStyle2}>
              <option value="admin">أدمن</option><option value="financial_manager">مدير مالي</option><option value="accountant">محاسب</option>

              <option value="custody_holder">أمين عهدة</option>

                    color: checked ? C.blue : C.text

                    <input type="checkbox" checked={checked} onChange={() => toggleFormBranch(b)} />

              })}

        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>

              {users.map((u) => (
                <tr key={u.id}>
                  <td style={td}>{u.username}</td><td style={td}>{u.name}</td>
                  <td style={td}>{ROLE_LABELS[u.role]}</td><td style={td}>{userBranches(u).join("، ") || "—"}</td>
                  <td style={td}>
                    <span onClick={() => editUser(u)} style={{ cursor: "pointer", color: C.blue, marginLeft: 10 }}>تعديل</span>
                    <span onClick={() => removeUser(u.id)} style={{ cursor: "pointer", color: C.danger }}>حذف</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
