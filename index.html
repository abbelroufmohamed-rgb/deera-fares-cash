function toWhatsAppNumber(phone) {
  if (!phone) return null;
  let digits = String(phone).replace(/[^\d]/g, "");
  if (!digits) return null;
  if (digits.startsWith("00")) digits = digits.slice(2);
  else if (digits.startsWith("0")) digits = "966" + digits.slice(1);
  else if (!digits.startsWith("966") && digits.length <= 10) digits = "966" + digits;
  return digits;
}
function whatsappLink(phone, message) {
  const num = toWhatsAppNumber(phone);
  if (!num) return null;
  return "https://wa.me/" + num + "?text=" + encodeURIComponent(message);
}

/* ============ حساب قيم الوردية ============ */
function computeShift(s) {
  const num = (x) => Number(x) || 0;
  const collection = num(s.collection);
  const purchases = num(s.purchases);
  const withdrawals = num(s.withdrawals);
  const foodicsCash = num(s.foodicsCash);
  const refund = num(s.refund);
  const transfer = num(s.transfer);
  const gulfNetwork = num(s.gulfNetwork);
  const amex = num(s.amex);
  const mastercard = num(s.mastercard);
  const mada = num(s.mada);
  const visa = num(s.visa);
  const madaFoodics = num(s.madaFoodics);
  const networkRefund = num(s.networkRefund); // استرجاع مدى فودكس (الشبكة) — بنفس منطق استرجاع الكاش

  const afterRefund = foodicsCash - refund;
  const madaFoodicsAfterRefund = madaFoodics - networkRefund;
  const realAmount = collection + purchases + withdrawals;
  const actualShortage = realAmount - afterRefund;

  const balanceTotal = transfer + gulfNetwork + amex + mastercard + mada + visa;
  const networkDiff = balanceTotal - madaFoodicsAfterRefund;

  const totalCollection = realAmount + balanceTotal;
  const totalFoodicsSales = afterRefund + madaFoodicsAfterRefund;
  const totalShortage = totalCollection - totalFoodicsSales;

  return {
    afterRefund, madaFoodicsAfterRefund, realAmount, actualShortage,
    balanceTotal, networkDiff,
    totalCollection, totalFoodicsSales, totalShortage,
  };
}

/* ============ كشف حساب شامل لموظف: يجمع كل عهده وسلفه (متعددة) في حساب واحد متصل زمنيًا،
   بحيث لو صرف أكتر من عهدة، الرصيد السالب يتغطى تلقائيًا من العهدة/السلفة الجديدة بدل ما يفضل معلّق منفصل ============ */
function EmployeeCombinedStatement({ employeeName, institutionId, institutionName, onClose }) {
  const [loading, setLoading] = useState(true);
  const [rows, setRows] = useState([]);
  const [totals, setTotals] = useState({ received: 0, spent: 0, remaining: 0 });

  useEffect(() => {
    let cancelled = false;
    async function load() {
      setLoading(true);
      const snap = await CUSTODIES_COL.where("employeeName", "==", employeeName).get();
      let custodies = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      custodies = custodies.filter((c) => (c.institutionId || DEFAULT_INSTITUTION_ID) === institutionId);

      const events = [];
      custodies.forEach((c) => {
        events.push({
          kind: "receipt", date: c.date, sortKey: (c.date || "") + "_0",
          label: (c.kind === "advance" ? "استلام سلفة" : "استلام عهدة") + (c.description ? " — " + c.description : ""),
          amount: Number(c.amount) || 0, supplierName: "—", category: "—",
        });
      });

      const expenseLists = await Promise.all(custodies.map((c) => custodyExpensesCol(c.id).get()));
      expenseLists.forEach((expSnap) => {
        expSnap.docs.forEach((d) => {
          const e = d.data();
          events.push({
            kind: "expense", date: e.date, sortKey: (e.date || "") + "_" + (e.enteredAt || 1),
            label: e.description || "مصروف", amount: -(Number(e.amount) || 0),
            supplierName: e.supplierName || "—", category: e.category || "—",
          });
        });
      });

      events.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
      let running = 0;
      const ledger = events.map((e) => { running += e.amount; return { ...e, balanceAfter: running }; });

      const received = custodies.reduce((s, c) => s + (Number(c.amount) || 0), 0);
      const spent = events.filter((e) => e.kind === "expense").reduce((s, e) => s + Math.abs(e.amount), 0);

      if (!cancelled) {
        setRows(ledger);
        setTotals({ received, spent, remaining: received - spent });
        setLoading(false);
      }
    }
    load();
    return () => { cancelled = true; };
  }, [employeeName, institutionId]);

  function doPrint() { window.print(); }

  return (
    <div>
      <div className="no-print" style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <button onClick={doPrint} style={smallBtn}>🖨️ طباعة الكشف الشامل</button>
        {onClose && <button onClick={onClose} style={ghostBtn}>رجوع</button>}
      </div>
      {loading ? (
        <div style={{ color: C.muted, padding: 20 }}>جارِ تجميع كل عهد ومصروفات {employeeName}...</div>
      ) : (
        <div className="print-area">
          <div className="print-only-header">
            <h2>{institutionName}</h2>
            <div>كشف حساب شامل (كل العهد والسلف) — {employeeName}</div>
          </div>
          <div style={cardStyle}>
            <div style={cardTitle}>📊 حساب "{employeeName}" — كل العهد والسلف مجمّعة زمنيًا</div>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>
              هذا الكشف بيربط كل عهدة وسلفة استلمها الموظف مع بعض في حساب واحد متصل — لو صرف أكتر من عهدة واحدة، أي رصيد سالب بيتغطى تلقائيًا من أي عهدة/سلفة جديدة يستلمها بعدها.
            </div>
          </div>
          <div style={cardStyle}>
            <div style={cardTitle}>📋 كل الحركات بالترتيب الزمني</div>
            <div style={{ overflowX: "auto" }}>
              <table style={tblStyle}>
                <thead><tr><th style={th}>التاريخ</th><th style={th}>البيان</th><th style={th}>المورد</th><th style={th}>الفئة</th><th style={th}>المبلغ</th><th style={th}>الرصيد المتراكم</th></tr></thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i} style={{ background: r.kind === "receipt" ? C.blueSoft : undefined }}>
                      <td style={td}>{r.date}</td>
                      <td style={{ ...td, fontWeight: r.kind === "receipt" ? 700 : 400 }}>{r.label}</td>
                      <td style={td}>{r.supplierName}</td>
                      <td style={td}>{r.category}</td>
                      <td style={{ ...td, color: r.amount < 0 ? C.danger : C.success, fontWeight: 700 }}>{r.amount < 0 ? "-" : "+"}{fmt(Math.abs(r.amount))}</td>
                      <td style={{ ...td, fontWeight: 800, color: r.balanceAfter < 0 ? C.danger : C.text }}>{fmt(r.balanceAfter)}</td>
                    </tr>
                  ))}
                  {rows.length === 0 && <tr><td colSpan={6} style={{ ...td, textAlign: "center", color: "#9ca3af" }}>ما فيه أي حركات مسجّلة</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
          <div style={cardStyle}>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>إجمالي كل العهد/السلف المستلمة</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(totals.received)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>إجمالي المصروف</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(totals.spent)}</div>
              </div>
              <div style={{
                flex: "1 1 200px", borderRadius: 10, padding: "12px 14px",
                background: totals.remaining < 0 ? "linear-gradient(135deg,#7f1d1d,#b91c1c)" : "linear-gradient(135deg,#0f2557,#1d4ed8)"
              }}>
                <div style={{ fontSize: 12, color: "#fde8e8" }}>{totals.remaining < 0 ? "مديونية على الموظف (صرف أكتر من اللي استلمه)" : "الرصيد المتبقي معه"}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: "#fff" }}>{fmt(Math.abs(totals.remaining))}</div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  const [msg, setMsg] = useState("");
  const [forms, setForms] = useState({}); // { custodyId: { amount, description, date, photo } }
  const [reportId, setReportId] = useState(null);
  const [showFullStatement, setShowFullStatement] = useState(false);
  const fileInputRefs = useRef({});

  useEffect(() => {
    const unsub = CUSTODIES_COL.where("employeeName", "==", currentUser.name).onSnapshot((snap) => {
      let data = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

    return unsub;
  }, [currentUser.name, institutionId]);

  // اشتراك في مصروفات كل عهدة على حدة — كل مصروف مستند منفصل فيمنع تخطي حد حجم المستند لما تتجمع الصور
  useEffect(() => {
    if (!custodies) return;
    const unsubs = custodies.map((c) =>
      custodyExpensesCol(c.id).onSnapshot((snap) => {
        const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        list.sort((a, b) => (a.enteredAt || 0) - (b.enteredAt || 0));
        setExpensesByCustody((prev) => ({ ...prev, [c.id]: list }));
      }, () => {})
    );
    return () => unsubs.forEach((u) => u());
    // eslint-disable-next-line
  }, [custodies && custodies.map((c) => c.id).join(",")]);

  function remainingOfficial(c) {
    const settled = (c.settlements || []).reduce((s, x) => s + (Number(x.cashReturned) || 0) + (Number(x.expensed) || 0), 0);
    return Math.max(0, (Number(c.amount) || 0) - settled);
  }
  function loggedTotal(expenses) {
    return (expenses || []).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  }
  function remainingByLog(c, expenses) {
    return (Number(c.amount) || 0) - loggedTotal(expenses);
  }
  /* العهدة القديمة (من قبل هذا التحديث) مفيهاش amountCash/amountBank — بنعتبرها كلها نقدي زي ما كانت شغالة قبل كده */
  function custodyCashAmount(c) {
    return c.amountCash !== undefined ? Number(c.amountCash) || 0 : (Number(c.amount) || 0);
  }
  function custodyBankAmount(c) {
    return c.amountBank !== undefined ? Number(c.amountBank) || 0 : 0;
  }
  /* المصروف القديم (بدون paymentMethod) بنعتبره نقدي بشكل افتراضي للتوافق مع التسجيلات القديمة */
  function loggedByMethod(expenses, method) {
    return (expenses || []).filter((x) => (x.paymentMethod || "cash") === method).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  }
  function remainingCashByLog(c, expenses) {
    return custodyCashAmount(c) - loggedByMethod(expenses, "cash");
  }
  function remainingBankByLog(c, expenses) {
    return custodyBankAmount(c) - loggedByMethod(expenses, "network");
  }

  function getForm(id) { return forms[id] || { amount: "", description: "", supplierName: "", category: "", paymentMethod: "cash", date: todayStr(), photo: null }; }
  function setForm(id, key, val) {
    setForms((f) => ({
      ...f,
      [id]: { ...(f[id] || { amount: "", description: "", supplierName: "", category: "", paymentMethod: "cash", date: todayStr(), photo: null }), [key]: val },
    }));
  }
  function setFormMulti(id, patch) {
    setForms((f) => ({
      ...f,
      [id]: { ...(f[id] || { amount: "", description: "", supplierName: "", category: "", paymentMethod: "cash", date: todayStr(), photo: null }), ...patch },
    }));
  }

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height) { if (width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; } }
          else { if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; } }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => reject(new Error("تعذرت قراءة الصورة"));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("تعذرت قراءة الملف"));
      reader.readAsDataURL(file);
    });
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = () => reject(new Error("تعذرت قراءة الملف"));
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoSelect(custodyId, file) {
    if (!file) return;
    const isImage = file.type.startsWith("image/");
    const isPdf = file.type === "application/pdf";
    if (!isImage && !isPdf) { setMsg("اختر صورة أو ملف PDF بس"); return; }
    setForm(custodyId, "attaching", true);
    try {
      if (isImage) {
        let dataUrl = await compressImage(file, 900, 0.55);
        if (dataUrl.length > 550000) dataUrl = await compressImage(file, 650, 0.4);
        if (dataUrl.length > 700000) { setMsg("الصورة كبيرة جدًا حتى بعد الضغط — جرّب صورة ثانية بزاوية أبعد"); setForm(custodyId, "attaching", false); return; }
        setFormMulti(custodyId, { photo: dataUrl, fileType: "image", attaching: false });
      } else {
        const dataUrl = await readFileAsDataURL(file);
        if (dataUrl.length > 700000) { setMsg("ملف الـ PDF كبير جدًا (الحد الأقصى تقريبًا 500 كيلوبايت) — جرّب ملف أصغر أو حوّله لصورة"); setForm(custodyId, "attaching", false); return; }
        setFormMulti(custodyId, { photo: dataUrl, fileType: "pdf", attaching: false });
      }
      setMsg("✅ تم إرفاق الملف بنجاح — شايفه تحت، واضغط \"حفظ المصروف\" عشان يتسجّل");
    } catch (e) { setMsg("تعذر تجهيز الملف: " + e.message); setForm(custodyId, "attaching", false); }
  }

  async function addExpense(c) {
    const f = getForm(c.id);
    const amt = Number(f.amount);
    if (!amt || amt <= 0) { setMsg("أدخل مبلغ صحيح أكبر من صفر"); return; }
    if (!f.description.trim()) { setMsg("اكتب وش هذا المصروف"); return; }
    const method = f.paymentMethod || "cash";
    const log = expensesByCustody[c.id] || [];
    const availableForMethod = method === "cash" ? remainingCashByLog(c, log) : remainingBankByLog(c, log);
    if (amt > availableForMethod + 0.01) {
      setMsg((method === "cash" ? "الرصيد النقدي" : "الرصيد البنكي/الشبكة") + " المتاح عندك " + fmt(availableForMethod) + " ر.س بس — قلّل المبلغ أو غيّر طريقة الصرف");
      return;
    }
    setSavingId(c.id); setMsg("");
    try {
      const entry = {
        amount: amt, description: f.description.trim(), supplierName: (f.supplierName || "").trim(),
        category: f.category || "", paymentMethod: method, date: f.date, photoUrl: f.photo || null, fileType: f.photo ? (f.fileType || "image") : null,
        enteredAt: Date.now(), enteredBy: currentUser.name,
      };
      await custodyExpensesCol(c.id).add(entry);
      await NOTIF_COL.add({
        type: "custody_expense", custodyId: c.id, employeeName: currentUser.name, amount: amt,
        date: f.date, branch: null, institutionId,
        message: `${currentUser.name} سجّل مصروف عهدة بقيمة ${fmt(amt)} ر.س (${method === "cash" ? "نقدي" : "شبكة/بنك"})` + (f.category ? ` — ${f.category}` : "") + (f.supplierName ? ` — ${f.supplierName}` : "") + (entry.photoUrl ? " (مرفق إثبات)" : ""),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), readBy: [],
      }).catch(() => {});
      setForms((fs) => ({ ...fs, [c.id]: { amount: "", description: "", supplierName: "", category: "", paymentMethod: "cash", date: todayStr(), photo: null, fileType: null, attaching: false } }));
      setMsg(entry.photoUrl ? "✅ تم تسجيل المصروف وحفظ المرفق بنجاح — شوفه في جدول \"مصروفاتك المسجّلة\" تحت" : "✅ تم تسجيل المصروف بنجاح");
    } catch (e) { setMsg("خطأ: " + e.message); }
    setSavingId(null);
  }

  async function deleteExpense(c, entryId) {
    if (!confirm("تحذف هذا المصروف من تسجيلك؟")) return;
    await custodyExpensesCol(c.id).doc(entryId).delete();
  }

    await custodyExpensesCol(c.id).doc(entryId).update({ photoUrl: null, fileType: null });

                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(reportCustody.amount)}</div>
              </div>
              <div style={{ flex: "1 1 200px", background: C.blueSoft, borderRadius: 10, padding: "12px 14px" }}>
                <div style={{ fontSize: 12, color: C.muted }}>إجمالي المصروف</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: C.navy }}>{fmt(total)}</div>
              </div>
              <div style={{
                flex: "1 1 200px", borderRadius: 10, padding: "12px 14px",

                <div style={{ fontSize: 12, color: "#fde8e8" }}>{rem < 0 ? "مديونية من هذه العهدة لوحدها" : "الرصيد المتبقي من هذه العهدة لوحدها"}</div>
                <div style={{ fontSize: 19, fontWeight: 800, color: "#fff" }}>{fmt(Math.abs(rem))}</div>
              </div>

              ملاحظة: هذا الرقم خاص بهذه العهدة بس، من غير احتساب أي عهد/سلف تانية لنفس الموظف. للرصيد الإجمالي الحقيقي، استخدم "كشف حساب شامل". والمرجع الرسمي النهائي هو تسوية المحاسب/المدير المالي.
            </div>
          </div>
        </div>
      </div>
    );
  }

          <div style={cardTitle}>🧍 عهدتي — {currentUser.name}</div>

        <div style={{ fontSize: 13, color: C.muted, marginBottom: 4 }}>
          من هنا تسجّل كل مصروف تصرفه من عهدتك (المبلغ، البيان، وصورة الفاتورة إذا تبي)، وتشوف كم استلمت وكم باقي عليك، وتطبع تقرير كامل عن عهدتك.

      {msg && <div style={{ marginBottom: 14, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}

      {custodies.length > 1 && (
        <div style={{

function InstitutionsAdmin({ institutions, allUsers }) {
  const [name, setName] = useState("");
  const [msg, setMsg] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [adminForm, setAdminForm] = useState({ username: "", password: "", name: "" });
  const [adminMsg, setAdminMsg] = useState("");

  async function addInstitution() {
    const trimmed = name.trim();
    if (!trimmed) return;
    if (institutions.some((i) => i.name === trimmed)) { setMsg("يوجد مؤسسة بنفس الاسم بالفعل"); return; }
    const ref = await INSTITUTIONS_COL.add({ name: trimmed, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await instMetaDoc(ref.id).set({ branches: [], shifts: DEFAULT_SHIFTS, sections: [] });
    setName("");
    setMsg("✅ تم إنشاء المؤسسة — الحين ضيف لها أول حساب أدمن");
    setExpandedId(ref.id);
  }

  function countUsers(instId) {
    return allUsers.filter((u) => (u.institutionId || DEFAULT_INSTITUTION_ID) === instId).length;
  }

  async function addFirstAdmin(instId) {
    if (!adminForm.username.trim() || !adminForm.password.trim() || !adminForm.name.trim()) {
      setAdminMsg("أكمل اسم المستخدم وكلمة المرور والاسم"); return;
    }
    if (allUsers.some((u) => u.username === adminForm.username.trim())) { setAdminMsg("اسم المستخدم موجود بالفعل في النظام"); return; }
    const newUser = {
      id: uid(), username: adminForm.username.trim(), password: adminForm.password.trim(),
      name: adminForm.name.trim(), role: "admin", branch: "", institutionId: instId,
    };
    await USERS_DOC.set({ list: [...allUsers, newUser] });
    setAdminForm({ username: "", password: "", name: "" });
    setAdminMsg("✅ تم إنشاء حساب الأدمن — تقدر تسجّل دخول فيه الحين");
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>🏢 إدارة المؤسسات</div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
          كل مؤسسة هنا معزولة بالكامل عن غيرها — فروعها، مستخدميها، ورادياتها، خزائنها، وتقاريرها كلها منفصلة تمامًا. الشاشة دي متاحة لك بس كسوبر أدمن.
        </div>
        <div style={{ display: "flex", gap: 10, marginBottom: 8 }}>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="اسم المؤسسة الجديدة" style={{ ...inputStyle2, maxWidth: 320 }} />
          <button onClick={addInstitution} style={smallBtn}>➕ إنشاء مؤسسة</button>
        </div>
        {msg && <div style={{ fontSize: 13, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>📋 المؤسسات الحالية ({institutions.length})</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {institutions.map((inst) => (
            <div key={inst.id} style={{ border: "1px solid " + C.border, borderRadius: 10, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontWeight: 800, color: C.navy, fontSize: 14.5 }}>{inst.name}</div>
                  <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{countUsers(inst.id)} مستخدم مسجّل</div>
                </div>
                <span onClick={() => { setExpandedId(expandedId === inst.id ? null : inst.id); setAdminMsg(""); }} style={{ cursor: "pointer", color: C.blue, fontWeight: 700, fontSize: 13 }}>
                  {expandedId === inst.id ? "إغلاق" : "+ إضافة حساب أدمن"}
                </span>
              </div>
              {expandedId === inst.id && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid " + C.border, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
                  <div><label style={smallLabel}>اسم المستخدم</label><input value={adminForm.username} onChange={(e) => setAdminForm((f) => ({ ...f, username: e.target.value }))} style={inputStyle2} /></div>
                  <div><label style={smallLabel}>كلمة المرور</label><input value={adminForm.password} onChange={(e) => setAdminForm((f) => ({ ...f, password: e.target.value }))} style={inputStyle2} /></div>
                  <div><label style={smallLabel}>الاسم</label><input value={adminForm.name} onChange={(e) => setAdminForm((f) => ({ ...f, name: e.target.value }))} style={inputStyle2} /></div>
                  <button onClick={() => addFirstAdmin(inst.id)} style={smallBtn}>حفظ</button>
                  {adminMsg && <div style={{ fontSize: 12.5, color: adminMsg.startsWith("✅") ? C.success : C.danger, flexBasis: "100%" }}>{adminMsg}</div>}
                </div>
              )}
            </div>
          ))}
          {institutions.length === 0 && <div style={{ color: "#9ca3af", fontSize: 13 }}>لا يوجد مؤسسات بعد</div>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [users, setUsers] = useState(null);
  const [institutions, setInstitutions] = useState(null);
  const [meta, setMeta] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("entry");

  useEffect(() => {
    const savedSession = localStorage.getItem("cashRecon-session");
    if (savedSession) {
      try {
        const u = JSON.parse(savedSession);
        setCurrentUser(u);
        if (u.role === "custody_holder") setTab("myCustody");
      } catch (e) {}
    }
  }, []);

  // تحميل المستخدمين والمؤسسات (عامة، مطلوبة لتسجيل الدخول قبل معرفة مؤسسة أحد)
  useEffect(() => {
    const unsub1 = USERS_DOC.onSnapshot((doc) => {
      if (doc.exists && doc.data().list) {
        setUsers(doc.data().list);
      } else {
        const seed = [{
          id: uid(), username: "admin", password: "admin123", name: "المدير العام",
          role: "admin", branch: "", institutionId: DEFAULT_INSTITUTION_ID, isSuperAdmin: true,
        }];
        USERS_DOC.set({ list: seed });
        setUsers(seed);
      }
    });
    const unsub2 = INSTITUTIONS_COL.onSnapshot((snap) => {
      if (snap.empty) {
        INSTITUTIONS_COL.doc(DEFAULT_INSTITUTION_ID).set({ name: DEFAULT_INSTITUTION_NAME, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        setInstitutions([{ id: DEFAULT_INSTITUTION_ID, name: DEFAULT_INSTITUTION_NAME }]);
      } else {
        setInstitutions(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      }
    });
    return () => { unsub1(); unsub2(); };
  }, []);

  // تحميل بيانات المؤسسة (الفروع/الورديات/الأقسام) الخاصة بالمستخدم الحالي بس، بعد تسجيل الدخول
  useEffect(() => {
    if (!currentUser) { setMeta(null); return; }
    const instId = currentUser.institutionId || DEFAULT_INSTITUTION_ID;
    const unsub = instMetaDoc(instId).onSnapshot((doc) => {
      if (doc.exists) { setMeta({ sections: [], cashierNames: [], ...doc.data() }); }
      else {
        const seed = { branches: DEFAULT_BRANCHES, shifts: DEFAULT_SHIFTS, sections: [] };
        instMetaDoc(instId).set(seed);
        setMeta(seed);
      }
    });
    return unsub;
  }, [currentUser && (currentUser.institutionId || DEFAULT_INSTITUTION_ID)]);

  useEffect(() => {
    if (users !== null && institutions !== null && (!currentUser || meta !== null)) setLoading(false);
  }, [users, institutions, meta, currentUser]);

  // مزامنة بيانات المستخدم الحالي مع أي تعديل صلاحيات لحظي
  useEffect(() => {
    if (currentUser && users) {
      const fresh = users.find((u) => u.id === currentUser.id);
      if (fresh && JSON.stringify(fresh) !== JSON.stringify(currentUser)) {
        setCurrentUser(fresh);
        localStorage.setItem("cashRecon-session", JSON.stringify(fresh));
      }
      if (!fresh) { handleLogout(); }
    }
    // eslint-disable-next-line
  }, [users]);

  function handleLogin(u) {
    const withInst = { ...u, institutionId: u.institutionId || DEFAULT_INSTITUTION_ID };
    setCurrentUser(withInst);
    localStorage.setItem("cashRecon-session", JSON.stringify(withInst));
    if (u.role === "custody_holder") setTab("myCustody");
    else setTab("entry");
  }
  function handleLogout() {
    setCurrentUser(null);
    localStorage.removeItem("cashRecon-session");
  }

  if (loading) return <AppLoadingScreen />;

function NotificationBell({ currentUser, setTab }) {
  const [open, setOpen] = useState(false);
  const [notifs, setNotifs] = useState([]);
  const boxRef = useRef(null);
  const institutionId = currentUser.institutionId || DEFAULT_INSTITUTION_ID;

  const scopeBranch = (currentUser.role === "branch_manager" || currentUser.role === "cashier") ? currentUser.branch : null;

  useEffect(() => {
    const unsub = NOTIF_COL.orderBy("createdAt", "desc").limit(150).onSnapshot((snap) => {
      let data = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      data = data.filter((n) => (n.institutionId || DEFAULT_INSTITUTION_ID) === institutionId);
      if (scopeBranch) data = data.filter((n) => n.branch === scopeBranch);
      setNotifs(data.slice(0, 60));
    });
    return unsub;
  }, [scopeBranch, institutionId]);

  useEffect(() => {
    function onClickOutside(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  const unread = notifs.filter((n) => !(n.readBy || []).includes(currentUser.id));

  async function markRead(n) {
    if ((n.readBy || []).includes(currentUser.id)) return;
    await NOTIF_COL.doc(n.id).update({ readBy: firebase.firestore.FieldValue.arrayUnion(currentUser.id) }).catch(() => {});
  }
  async function markAllRead() {
    await Promise.all(unread.map((n) =>
      NOTIF_COL.doc(n.id).update({ readBy: firebase.firestore.FieldValue.arrayUnion(currentUser.id) }).catch(() => {})
    ));
  }
  function timeAgo(ts) {
    if (!ts || !ts.toDate) return "";
    const diffMs = Date.now() - ts.toDate().getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "الآن";
    if (mins < 60) return "منذ " + mins + " د";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return "منذ " + hrs + " س";
    return "منذ " + Math.floor(hrs / 24) + " يوم";
  }

  return (
    <div ref={boxRef} style={{ position: "relative" }}>
      <button onClick={() => setOpen((v) => !v)} style={{
        background: "rgba(255,255,255,0.14)", border: "none", borderRadius: "50%",
        width: 36, height: 36, cursor: "pointer", position: "relative", color: "#fff",
        display: "flex", alignItems: "center", justifyContent: "center"
      }}>
        <Icon name="bell" size={18} />
        {unread.length > 0 && (
          <span style={{
            position: "absolute", top: -3, left: -3, background: C.danger, color: "#fff",
            borderRadius: "50%", minWidth: 17, height: 17, fontSize: 10, fontWeight: 800,
            display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px"
          }}>{unread.length > 9 ? "9+" : unread.length}</span>
        )}
      </button>

      {open && (
        <div style={{
          position: "absolute", left: 0, top: 44, width: 340, maxHeight: 420, overflowY: "auto",
          background: "#fff", borderRadius: 12, boxShadow: "0 12px 30px rgba(15,37,87,0.25)",
          border: "1px solid " + C.border, zIndex: 50, color: C.text
        }}>
          <div style={{ padding: "12px 14px", borderBottom: "1px solid " + C.border, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontWeight: 800, fontSize: 13.5, color: C.navy, display: "flex", alignItems: "center", gap: 6 }}><Icon name="bell" size={15} color={C.navy} /> الإشعارات</div>
            {unread.length > 0 && (
              <span onClick={markAllRead} style={{ fontSize: 12, color: C.blue, cursor: "pointer", fontWeight: 700 }}>تعليم الكل كمقروء</span>
            )}
          </div>
          {notifs.length === 0 && (
            <div style={{ padding: 24, textAlign: "center", color: "#9ca3af", fontSize: 13 }}>لا يوجد إشعارات حاليًا</div>
          )}
          {notifs.map((n) => {
            const isUnread = !(n.readBy || []).includes(currentUser.id);
            return (
              <div key={n.id} onClick={() => { markRead(n); setTab("report"); setOpen(false); }} style={{
                padding: "11px 14px", borderBottom: "1px solid #f1f4f9", cursor: "pointer",
                background: isUnread ? C.blueSoft : "#fff", display: "flex", gap: 8
              }}>
                <div style={{ fontSize: 16, marginTop: 1 }}>{n.shortage < 0 ? "🔴" : "🟢"}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12.5, fontWeight: isUnread ? 800 : 600, color: C.text, lineHeight: 1.5 }}>{n.message}</div>
                  <div style={{ fontSize: 11, color: C.muted, marginTop: 3 }}>{n.date} · {timeAgo(n.createdAt)}</div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function padReceiptNo(n) {
  return String(n).padStart(5, "0");
}

/* ============ تحويل الأرقام لكلام عربي (للسندات الرسمية) ============ */
function numberToArabicWords(num) {
  const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
  const teens = ['عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  const scales = ['', 'ألف', 'مليون', 'مليار'];

  function threeDigits(n) {
    const parts = [];
    const h = Math.floor(n / 100), rem = n % 100;
    if (h > 0) parts.push(hundreds[h]);
    if (rem > 0) {
      if (rem < 10) parts.push(ones[rem]);
      else if (rem < 20) parts.push(teens[rem - 10]);
      else {
        const t = Math.floor(rem / 10), o = rem % 10;
        if (o > 0) parts.push(ones[o] + ' و' + tens[t]);
        else parts.push(tens[t]);
      }
    }
    return parts.join(' و');
  }

  function integerToWords(n) {
    if (n === 0) return 'صفر';
    const groups = [];
    let x = n;
    while (x > 0) { groups.push(x % 1000); x = Math.floor(x / 1000); }
    const wordGroups = [];
    for (let i = groups.length - 1; i >= 0; i--) {
      if (groups[i] === 0) continue;
      let g = threeDigits(groups[i]);
      if (i > 0) {
        if (groups[i] === 1) g = scales[i];
        else if (groups[i] === 2) g = (i === 1 ? 'ألفان' : (i === 2 ? 'مليونان' : 'ملياران'));
        else if (groups[i] >= 3 && groups[i] <= 10) g = g + ' ' + (scales[i] === 'ألف' ? 'آلاف' : (scales[i] === 'مليون' ? 'ملايين' : 'مليارات'));
        else g = g + ' ' + scales[i];
      }
      wordGroups.push(g);
    }
    return wordGroups.join(' و');
  }

  const intPart = Math.floor(num);
  const halalas = Math.round((num - intPart) * 100);

  let riyalWord;
  if (intPart === 1) riyalWord = 'ريال واحد';
  else if (intPart === 2) riyalWord = 'ريالان';
  else if (intPart >= 3 && intPart <= 10) riyalWord = integerToWords(intPart) + ' ريالات';
  else riyalWord = integerToWords(intPart) + ' ريال';

  let result = riyalWord;
  if (halalas > 0) {
    let halalaWord;
    if (halalas === 1) halalaWord = 'هللة واحدة';
    else if (halalas === 2) halalaWord = 'هللتان';
    else if (halalas >= 3 && halalas <= 10) halalaWord = integerToWords(halalas) + ' هللات';
    else halalaWord = integerToWords(halalas) + ' هللة';
    result += ' و' + halalaWord;
  }
  return result + ' فقط لا غير';
}

async function getNextReceiptNo(institutionId, branch) {
  const metaRef = instMetaDoc(institutionId);
  const next = await db.runTransaction(async (tx) => {
    const snap = await tx.get(metaRef);
    const data = snap.exists ? snap.data() : {};
    const branchCounters = data.branchCounters || {};
    const current = Number(branchCounters[branch]) || 0;
    const updated = current + 1;
    tx.set(metaRef, { branchCounters: { ...branchCounters, [branch]: updated } }, { merge: true });
    return updated;
  });
  return padReceiptNo(next);
}

/* ============ ترقيم سندات الخزينة (قبض / صرف) ============ */
async function getNextVoucherNo(institutionId, kind) {
  // kind: 'receipt' لسند القبض أو 'payment' لسند الصرف
  const metaRef = instMetaDoc(institutionId);
  const next = await db.runTransaction(async (tx) => {
    const snap = await tx.get(metaRef);
    const data = snap.exists ? snap.data() : {};
    const voucherCounters = data.voucherCounters || {};
    const current = Number(voucherCounters[kind]) || 0;
    const updated = current + 1;
    tx.set(metaRef, { voucherCounters: { ...voucherCounters, [kind]: updated } }, { merge: true });
    return updated;
  });
  const prefix = kind === "receipt" ? "ق" : "ص";
  return prefix + "-" + padReceiptNo(next);
}

async function assignVoucherNoIfMissing(t, institutionId) {
  if (t.voucherNo) return t.voucherNo;
  const kind = t.type === "deposit" ? "receipt" : "payment";
  const voucherNo = await getNextVoucherNo(institutionId, kind);
  await TREASURY_TX_COL.doc(t.id).update({ voucherNo });
  return voucherNo;
}

async function syncShortageNotification(shiftId, shift, meta, institutionId) {
  const threshold = Number(meta.shortageThreshold) || DEFAULT_SHORTAGE_THRESHOLD;
  const shortage = Number(shift.totalShortage) || 0;
  const exceeds = Math.abs(shortage) >= threshold;
  const ref = NOTIF_COL.doc(shiftId);
  if (exceeds) {
    const kind = shortage < 0 ? "عجز" : "زيادة";
    await ref.set({
      shiftId, branch: shift.branch, date: shift.date, shiftLabel: shift.shiftLabel,
      cashierName: shift.cashierName, shortage, institutionId: institutionId || DEFAULT_INSTITUTION_ID,
      message: `${kind} بقيمة ${Math.abs(shortage).toFixed(2)} ر.س — ${shift.branch} — وردية ${shift.shiftLabel} — الكاشير ${shift.cashierName}`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      readBy: [],
    }, { merge: false });
  } else {
    await ref.delete().catch(() => {});
  }
}

/* ============ تبويب التقارير ============ */
function dateInRange(d, from, to) { return d >= from && d <= to; }

function presetRange(kind) {
  const now = new Date();
  if (kind === "thisMonth") {
    const from = new Date(now.getFullYear(), now.getMonth(), 1);
    const to = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
  }
  if (kind === "lastMonth") {
    const from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const to = new Date(now.getFullYear(), now.getMonth(), 0);
    return { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
  }
  if (kind === "last7") {
    const to = new Date();
    const from = new Date(); from.setDate(from.getDate() - 6);
    return { from: from.toISOString().slice(0, 10), to: to.toISOString().slice(0, 10) };
  }
  return { from: firstDayOfMonth(), to: todayStr() };
}

/* ============ محرك التحليل الذكي التلقائي (إحصائي، يعمل محليًا بدون أي API خارجي) ============ */
function computeSmartInsights(rows) {
  if (!rows || rows.length === 0) return null;

  const byCashier = {};
  rows.forEach((r) => {
    const k = r.cashierName || "—";
    if (!byCashier[k]) byCashier[k] = { name: k, count: 0, totalShortage: 0, totalCollection: 0, dates: [] };
    byCashier[k].count += 1;
    byCashier[k].totalShortage += Number(r.totalShortage) || 0;
    byCashier[k].totalCollection += Number(r.totalCollection) || 0;
    byCashier[k].dates.push(r.date);
  });
  const cashierList = Object.values(byCashier);

  const totalShortage = rows.reduce((s, r) => s + (Number(r.totalShortage) || 0), 0);
  const totalCollection = rows.reduce((s, r) => s + (Number(r.totalCollection) || 0), 0);

  const mean = cashierList.reduce((s, c) => s + c.totalShortage, 0) / (cashierList.length || 1);
  const variance = cashierList.reduce((s, c) => s + Math.pow(c.totalShortage - mean, 2), 0) / (cashierList.length || 1);
  const stddev = Math.sqrt(variance);

  const outlierCashiers = cashierList.filter((c) => stddev > 1 && (mean - c.totalShortage) > 1.3 * stddev && c.totalShortage < -5);

  const sortedByShortage = [...cashierList].sort((a, b) => a.totalShortage - b.totalShortage);
  const worst = sortedByShortage[0];
  const best = sortedByShortage[sortedByShortage.length - 1];

  const repeatedPatterns = [];
  cashierList.forEach((c) => {
    const cRows = rows.filter((r) => r.cashierName === c.name).sort((a, b) => a.date.localeCompare(b.date));
    let streak = 0, maxStreak = 0, lastDate = null;
    cRows.forEach((r) => {
      if ((Number(r.totalShortage) || 0) < -0.5) { streak++; maxStreak = Math.max(maxStreak, streak); }
      else streak = 0;
    });
    if (maxStreak >= 3) repeatedPatterns.push({ name: c.name, streak: maxStreak });
  });

  const byBranch = {};
  rows.forEach((r) => {
    const k = r.branch || "—";
    if (!byBranch[k]) byBranch[k] = { name: k, totalShortage: 0, totalCollection: 0, count: 0 };
    byBranch[k].totalShortage += Number(r.totalShortage) || 0;
    byBranch[k].totalCollection += Number(r.totalCollection) || 0;
    byBranch[k].count += 1;
  });
  const branchList = Object.values(byBranch).map((b) => ({ ...b, ratio: b.totalCollection > 0 ? (b.totalShortage / b.totalCollection) * 100 : 0 }));
  const worstBranch = branchList.length > 1 ? [...branchList].sort((a, b) => a.ratio - b.ratio)[0] : null;
  const bestBranch = branchList.length > 1 ? [...branchList].sort((a, b) => b.ratio - a.ratio)[0] : null;

  return { totalShortage, totalCollection, cashierList, outlierCashiers, best, worst, repeatedPatterns, branchList, worstBranch, bestBranch };
}

function SmartInsights({ rows }) {
  const data = useMemo(() => computeSmartInsights(rows), [rows]);
  if (!data) return null;

  const items = [];
  const shortagePct = data.totalCollection > 0 ? (data.totalShortage / data.totalCollection) * 100 : 0;

  items.push({
    kind: shortagePct < -0.3 ? "warning" : (shortagePct > 0.3 ? "success" : "info"),
    text: `الأداء العام: صافي العجز/الزيادة ${fmt(data.totalShortage)} ر.س، بنسبة ${shortagePct.toFixed(2)}% من إجمالي التحصيل (${fmt(data.totalCollection)} ر.س) — ${shortagePct < -0.3 ? "نسبة العجز أعلى من المعتاد وتستحق المتابعة" : (shortagePct > 0.3 ? "أداء جيد بزيادة صافية" : "ضمن النطاق الطبيعي")}.`,
  });

  if (data.worst && data.worst.totalShortage < -5) {
    items.push({ kind: "warning", text: `أكبر عجز مسجّل عند الكاشير "${data.worst.name}" بإجمالي ${fmt(data.worst.totalShortage)} ر.س خلال ${data.worst.count} وردية.` });
  }
  if (data.best && data.best.totalShortage > 5) {
    items.push({ kind: "success", text: `أفضل أداء كان للكاشير "${data.best.name}" بزيادة صافية ${fmt(data.best.totalShortage)} ر.س خلال ${data.best.count} وردية.` });
  }

  data.outlierCashiers.forEach((c) => {
    items.push({ kind: "warning", text: `⚠️ ملاحظة إحصائية: عجز الكاشير "${c.name}" (${fmt(c.totalShortage)} ر.س) بعيد بشكل ملحوظ عن متوسط باقي الكاشيرين — يستحق مراجعة فردية.` });
  });

  data.repeatedPatterns.forEach((p) => {
    items.push({ kind: "warning", text: `🔁 نمط متكرر: الكاشير "${p.name}" سجّل عجز في ${p.streak} ورديات متتالية — قد يشير لمشكلة تحتاج تدخّل.` });
  });

  if (data.worstBranch && data.bestBranch && data.worstBranch.name !== data.bestBranch.name) {
    items.push({ kind: "info", text: `مقارنة الفروع: فرع "${data.bestBranch.name}" الأفضل نسبيًا (${data.bestBranch.ratio.toFixed(2)}%)، بينما فرع "${data.worstBranch.name}" الأضعف نسبيًا (${data.worstBranch.ratio.toFixed(2)}%) من حيث نسبة العجز للتحصيل.` });
  }

  if (items.length === 1 && data.outlierCashiers.length === 0 && data.repeatedPatterns.length === 0) {
    items.push({ kind: "success", text: "لا توجد ملاحظات شاذة تستدعي القلق في هذه الفترة — الأداء مستقر بوجه عام." });
  }

  const KIND_STYLE = {
    warning: { bg: "#fef2f2", border: "#fecaca", icon: "⚠️", color: "#991b1b" },
    success: { bg: "#f0fdf4", border: "#bbf7d0", icon: "✅", color: "#166534" },
    info: { bg: "#eff6ff", border: "#bfdbfe", icon: "ℹ️", color: "#1e40af" },
  };

  return (
    <div style={{
      background: "linear-gradient(135deg,#faf5ff,#f5f3ff)", border: "1px solid #ddd6fe", borderRadius: 14,
      padding: 20, marginBottom: 18
    }}>
      <div style={{ fontWeight: 800, fontSize: 15, color: "#5b21b6", marginBottom: 4, display: "flex", alignItems: "center", gap: 8 }}>
        🤖 تحليل ذكي تلقائي
      </div>
      <div style={{ fontSize: 11.5, color: "#7c3aed", marginBottom: 14 }}>تحليل إحصائي فوري لبيانات هذه الفترة — يعمل محليًا داخل التطبيق</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {items.map((it, i) => {
          const s = KIND_STYLE[it.kind];
          return (
            <div key={i} style={{
              background: s.bg, border: "1px solid " + s.border, borderRadius: 10, padding: "10px 13px",
              fontSize: 13, color: s.color, display: "flex", gap: 8, lineHeight: 1.6
            }}>
              <span>{s.icon}</span><span>{it.text}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ReportTab({ currentUser, meta, users, institutionName }) {
  const isCashier = currentUser.role === "cashier";
  const isBranchManager = currentUser.role === "branch_manager";
  const institutionId = currentUser.institutionId || DEFAULT_INSTITUTION_ID;
  const managerBranches = isBranchManager ? userBranches(currentUser) : null; // مدير الفرع ممكن يكون معيّن على أكتر من فرع دلوقتي
  const lockedBranch = (managerBranches && managerBranches.length === 1) ? managerBranches[0] : null;
  const canSeeAllBranches = currentUser.role === "admin" || currentUser.role === "accountant";

  const [mode, setMode] = useState(isCashier ? "cashier" : "branch"); // "branch" | "cashier" | "section" | "tree"
  const [branch, setBranch] = useState(lockedBranch || "الكل");
  const [cashierFilter, setCashierFilter] = useState(isCashier ? currentUser.name : "الكل");
  const [sectionFilter, setSectionFilter] = useState("الكل");
  const [treeNodeFilter, setTreeNodeFilter] = useState("");
  const initRange = presetRange("thisMonth");
  const [fromDate, setFromDate] = useState(initRange.from);
  const [toDate, setToDate] = useState(initRange.to);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    setLoading(true);
    let q = SHIFTS_COL;
    if (lockedBranch) q = q.where("branch", "==", lockedBranch);
    const unsub = q.onSnapshot((snap) => {
      let data = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      data = data.filter((r) => (r.institutionId || DEFAULT_INSTITUTION_ID) === institutionId);
      data = data.filter((r) => r.date && dateInRange(r.date, fromDate, toDate));
      if (managerBranches && managerBranches.length > 1) {
        data = data.filter((r) => managerBranches.includes(r.branch));
        if (branch !== "الكل") data = data.filter((r) => r.branch === branch);
      } else if (!lockedBranch && branch !== "الكل") {
        data = data.filter((r) => r.branch === branch);
      }
      if (mode === "cashier" && cashierFilter !== "الكل") data = data.filter((r) => r.cashierName === cashierFilter);
      if (mode === "section" && sectionFilter !== "الكل") {
        const sec = (meta.sections || []).find((s) => s.name === sectionFilter);
        const secBranches = sec ? (sec.branches || []) : [];
        data = data.filter((r) => secBranches.includes(r.branch));
      }
      if (mode === "tree" && treeNodeFilter) {
        const treeBranches = collectDescendantBranchNames(treeNodeFilter, meta.branchTree || []);
        data = data.filter((r) => treeBranches.includes(r.branch));
      }
      if (isCashier) data = data.filter((r) => r.cashierName === currentUser.name);
      data.sort((a, b) => (a.date + a.shiftLabel).localeCompare(b.date + b.shiftLabel));
      setRows(data);
      setLoading(false);
    });
    return unsub;
  }, [branch, fromDate, toDate, lockedBranch, managerBranches && managerBranches.join(","), mode, cashierFilter, sectionFilter, treeNodeFilter, isCashier, meta.sections, meta.branchTree, institutionId]);

  const totals = useMemo(() => {
    const t = { collection: 0, totalCollection: 0, totalFoodicsSales: 0, totalShortage: 0, actualShortage: 0 };
    rows.forEach((r) => {
      t.collection += Number(r.collection) || 0;
      t.totalCollection += Number(r.totalCollection) || 0;
      t.totalFoodicsSales += Number(r.totalFoodicsSales) || 0;
      t.totalShortage += Number(r.totalShortage) || 0;
      t.actualShortage += Number(r.actualShortage) || 0;
    });
    return t;
  }, [rows]);

  const byCashier = useMemo(() => {
    const map = {};
    rows.forEach((r) => {
      const k = r.cashierName || "—";
      if (!map[k]) map[k] = { name: k, count: 0, totalShortage: 0, totalCollection: 0 };
      map[k].count += 1;
      map[k].totalShortage += Number(r.totalShortage) || 0;
      map[k].totalCollection += Number(r.totalCollection) || 0;
    });
    return Object.values(map).sort((a, b) => a.totalShortage - b.totalShortage);
  }, [rows]);

  const byBranch = useMemo(() => {
    const map = {};
    rows.forEach((r) => {
      const k = r.branch || "—";
      if (!map[k]) map[k] = { name: k, count: 0, totalShortage: 0, totalCollection: 0 };
      map[k].count += 1;
      map[k].totalShortage += Number(r.totalShortage) || 0;
      map[k].totalCollection += Number(r.totalCollection) || 0;
    });
    return Object.values(map).sort((a, b) => b.totalCollection - a.totalCollection);
  }, [rows]);

  const branchToSection = useMemo(() => {
    const map = {};
    (meta.sections || []).forEach((s) => (s.branches || []).forEach((b) => { map[b] = s.name; }));
    return map;
  }, [meta.sections]);

  const bySection = useMemo(() => {
    const map = {};
    rows.forEach((r) => {
      const k = branchToSection[r.branch] || "بدون قسم";
      if (!map[k]) map[k] = { name: k, count: 0, totalShortage: 0, totalCollection: 0 };
      map[k].count += 1;
      map[k].totalShortage += Number(r.totalShortage) || 0;
      map[k].totalCollection += Number(r.totalCollection) || 0;
    });
    return Object.values(map).sort((a, b) => b.totalCollection - a.totalCollection);
  }, [rows, branchToSection]);

  const sectionOptions = ["الكل", ...(meta.sections || []).map((s) => s.name)];

  const branchOptions = managerBranches && managerBranches.length > 1 ? ["الكل", ...managerBranches] : ["الكل", ...meta.branches];
  const allCashierNames = useMemo(() => {
    const fromUsers = users.filter((u) => u.role === "cashier" && (!lockedBranch || userBranches(u).includes(lockedBranch))).map((u) => u.name);
    return ["الكل", ...Array.from(new Set(fromUsers))];
  }, [users, lockedBranch]);

  function doPrint() { window.print(); }

  const periodLabel = fromDate === toDate ? fromDate : (fromDate + "  →  " + toDate);
  const scopeLabel = mode === "cashier" && cashierFilter !== "الكل" ? "الكاشير: " + cashierFilter
    : (mode === "section" ? (sectionFilter !== "الكل" ? "القسم: " + sectionFilter : "كل الأقسام")
    : (branch !== "الكل" ? "الفرع: " + branch : "كل الفروع"));

/* ============ التقرير اليومي: العجز/الزيادة لكل كاشير في كل يوم ============ */
function DailyCashierMatrix({ rows }) {
  const { dates, cashiers, matrix, dayTotals, cashierTotals, grandTotal } = useMemo(() => {
    const dateSet = new Set();
    const cashierSet = new Set();
    const map = {}; // map[date][cashier] = { shortage, count }

    rows.forEach((r) => {
      const d = r.date || "—";
      const c = r.cashierName || "—";
      dateSet.add(d);
      cashierSet.add(c);
      if (!map[d]) map[d] = {};
      if (!map[d][c]) map[d][c] = { shortage: 0, count: 0 };
      map[d][c].shortage += Number(r.totalShortage) || 0;
      map[d][c].count += 1;
    });

    const dates = Array.from(dateSet).sort();
    const cashiers = Array.from(cashierSet).sort();

    const dayTotals = {};
    const cashierTotals = {};
    let grandTotal = 0;
    dates.forEach((d) => { dayTotals[d] = 0; });
    cashiers.forEach((c) => { cashierTotals[c] = 0; });

    dates.forEach((d) => {
      cashiers.forEach((c) => {
        const cell = (map[d] && map[d][c]) ? map[d][c].shortage : 0;
        dayTotals[d] += cell;
        cashierTotals[c] += cell;
        grandTotal += cell;
      });
    });

    return { dates, cashiers, matrix: map, dayTotals, cashierTotals, grandTotal };
  }, [rows]);

  if (dates.length === 0) return null;

  return (
    <div style={cardStyle}>
      <div style={cardTitle}>📅 التقرير اليومي — العجز/الزيادة لكل كاشير</div>
      <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>
        كل خلية بتوضح صافي العجز (بالأحمر) أو الزيادة (بالأخضر) لهذا الكاشير في هذا اليوم، بمجموع كل الورديات اللي دخلها.
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={tblStyle}>
          <thead>
            <tr>
              <th style={th}>التاريخ</th>
              {cashiers.map((c) => <th key={c} style={th}>{c}</th>)}
              <th style={{ ...th, background: "#dbe6ff" }}>إجمالي اليوم</th>
            </tr>
          </thead>
          <tbody>
            {dates.map((d) => (
              <tr key={d}>
                <td style={{ ...td, fontWeight: 700 }}>{d}</td>
                {cashiers.map((c) => {
                  const cell = matrix[d] && matrix[d][c];
                  const val = cell ? cell.shortage : null;
                  return (
                    <td key={c} style={{ ...td, color: val == null ? "#c9d2de" : (val < 0 ? C.danger : C.success), fontWeight: val ? 700 : 400 }}>
                      {val == null ? "—" : fmt(val)}
                    </td>
                  );
                })}
                <td style={{ ...td, fontWeight: 800, color: dayTotals[d] < 0 ? C.danger : C.success, background: C.blueSoft }}>
                  {fmt(dayTotals[d])}
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr style={{ background: C.blueSoft, fontWeight: 800 }}>
              <td style={td}>الإجمالي الكلي</td>
              {cashiers.map((c) => (
                <td key={c} style={{ ...td, color: cashierTotals[c] < 0 ? C.danger : C.success }}>{fmt(cashierTotals[c])}</td>
              ))}
              <td style={{ ...td, color: grandTotal < 0 ? C.danger : C.success }}>{fmt(grandTotal)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
}

const TX_TYPE_LABELS = {
  deposit: "إيداع / توريد",
  expense: "صرف",
  transfer_out: "تحويل صادر",
  transfer_in: "تحويل وارد",
  custody_out: "عهدة صادرة",
  custody_settle: "تسوية عهدة (نقدي)",
};

function treasuryDocId(institutionId, branch) {
  const inst = institutionId || DEFAULT_INSTITUTION_ID;
  return branch ? (inst + "__branch_" + branch) : (inst + "__general");
}

async function ensureDefaultTreasuries(meta, existing, institutionId) {
  const haveGeneral = existing.some((t) => t.branch === null || t.branch === undefined);
  const batchOps = [];
  if (!haveGeneral) {
    batchOps.push(TREASURIES_COL.doc(treasuryDocId(institutionId, null)).set({
      name: "الخزينة العامة", branch: null, institutionId, openingBalance: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
  }
  meta.branches.forEach((b) => {
    const has = existing.some((t) => t.branch === b);
    if (!has) {
      batchOps.push(TREASURIES_COL.doc(treasuryDocId(institutionId, b)).set({
        name: "خزينة " + b, branch: b, institutionId, openingBalance: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      }));
    }
  });
  if (batchOps.length) await Promise.all(batchOps);
}

function computeTreasuryBalance(treasury, txs) {
  let bal = Number(treasury.openingBalance) || 0;
  txs.forEach((t) => {
    if (t.treasuryId !== treasury.id) return;
    const amt = Number(t.amount) || 0;
    if (t.type === "deposit" || t.type === "transfer_in" || t.type === "custody_settle") bal += amt;
    else if (t.type === "expense" || t.type === "transfer_out" || t.type === "custody_out") bal -= amt;
  });
  return bal;
}

  const institutionId = currentUser.institutionId || DEFAULT_INSTITUTION_ID;

    return "mailto:" + managerEmails.join(",") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  async function submitRequest() {
    const amt = Number(amount);
    if (!amt || amt <= 0) { setMsg("أدخل مبلغ صحيح أكبر من صفر"); return; }
    if (!treasuryId) { setMsg("اختر الخزينة"); return; }
    if (!description.trim()) { setMsg("اكتب سبب/بيان الصرف"); return; }
    setSaving(true); setMsg("");
    try {
      const payload = {
        treasuryId, amount: amt, date, category: category || "", description: description.trim(),
        institutionId, status: "pending",
        requestedById: currentUser.id, requestedBy: currentUser.name, requestedByRole: currentUser.role,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      };
      await EXPENSE_REQUESTS_COL.add(payload);
      setLastSubmitted(payload);
      setAmount(""); setDescription(""); setCategory("");
      setMsg("✅ تم إرسال طلب الصرف للمدير المالي للمراجعة");
    } catch (e) { setMsg("خطأ: " + e.message); }
    setSaving(false);
  }

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📝 طلب صرف جديد</div>

        </div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 14 }}>
          <div>
            <label style={smallLabel}>الخزينة</label>
            <select value={treasuryId} onChange={(e) => setTreasuryId(e.target.value)} style={inputStyle2}>
              {treasuries.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div>
            <label style={smallLabel}>المبلغ</label>
            <input type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} style={{ ...inputStyle2, width: 140 }} />
          </div>
          <div>
            <label style={smallLabel}>التاريخ</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle2} />
          </div>
          <div>
            <label style={smallLabel}>الفئة (اختياري)</label>
            <select value={category} onChange={(e) => setCategory(e.target.value)} style={inputStyle2}>
              <option value="">بدون تصنيف</option>
              {TX_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{ flex: "1 1 100%" }}>
            <label style={smallLabel}>البيان / سبب الصرف</label>
            <input value={description} onChange={(e) => setDescription(e.target.value)} style={inputStyle2} placeholder="اكتب تفاصيل واضحة عشان تسهّل مراجعة المدير المالي" />
          </div>
        </div>
        <button onClick={submitRequest} disabled={saving} style={{ ...smallBtn, padding: "11px 26px", fontSize: 15 }}>
          {saving ? "جارِ الإرسال..." : "📤 إرسال طلب الصرف"}
        </button>
        {msg && <div style={{ marginTop: 10, fontSize: 13.5, color: msg.startsWith("✅") ? C.success : C.danger }}>{msg}</div>}
        {lastSubmitted && (
          managerEmails.length > 0 ? (
            <div style={{ marginTop: 12, background: "#eff6ff", border: "1px solid #bfdbfe", borderRadius: 10, padding: "10px 14px" }}>
              <div style={{ fontSize: 12.5, color: C.navy, marginBottom: 8 }}>عايز تأكد وصول الطلب؟ راسل المدير المالي بالإيميل مباشرة (هيفتحلك تطبيق الإيميل عندك برسالة جاهزة):</div>
              <a href={buildMailtoLink(lastSubmitted)} style={{
                display: "inline-flex", alignItems: "center", gap: 6, background: C.blue, color: "#fff",
                borderRadius: 20, padding: "7px 16px", fontSize: 13, fontWeight: 700, textDecoration: "none",
              }}>📧 راسل المدير المالي بالطلب</a>
            </div>
          ) : (
            <div style={{ marginTop: 10, fontSize: 11.5, color: C.muted }}>ملاحظة: لسه محدّش من المدير المالي/الأدمن عنده إيميل مسجّل — أضيفه من الإعدادات ↦ إدارة المستخدمين عشان زرار المراسلة يظهر.</div>
          )
        )}
      </div>

      <div style={cardStyle}>
        <div style={cardTitle}>🕒 طلباتي السابقة</div>
        <div style={{ overflowX: "auto" }}>
          <table style={tblStyle}>
            <thead><tr><th style={th}>التاريخ</th><th style={th}>الخزينة</th><th style={th}>البيان</th><th style={th}>المبلغ</th><th style={th}>الحالة</th><th style={th}>ملاحظة المدير المالي</th></tr></thead>

function TreasuryOverview({ treasuries, txs, custodies, users }) {
  const [showZero, setShowZero] = useState(false);
  const outstandingCustody = useMemo(() => {
    let total = 0;
    custodies.forEach((c) => {
      const settled = (c.settlements || []).reduce((s, x) => s + (Number(x.cashReturned) || 0) + (Number(x.expensed) || 0), 0);
      total += Math.max(0, (Number(c.amount) || 0) - settled);
    });
    return total;
  }, [custodies]);

  const grandTotal = treasuries.reduce((s, t) => s + computeTreasuryBalance(t, txs), 0);

  const treasuriesWithBalance = treasuries.map((t) => ({ t, bal: computeTreasuryBalance(t, txs) }));
  const visibleTreasuries = showZero ? treasuriesWithBalance : treasuriesWithBalance.filter((x) => Math.abs(x.bal) > 0.009);
  const hiddenCount = treasuriesWithBalance.length - visibleTreasuries.length;

  // ملخّص سريع لكل موظف عنده عهدة/سلفة — كم استلم وكم باقي عليه، من غير ما تفتح كل واحد لوحده
  const employeeSummary = useMemo(() => {
    const map = {};
    custodies.forEach((c) => {
      const settled = (c.settlements || []).reduce((s, x) => s + (Number(x.cashReturned) || 0) + (Number(x.expensed) || 0), 0);
      const remaining = Math.max(0, (Number(c.amount) || 0) - settled);
      const key = c.employeeName || "—";
      if (!map[key]) map[key] = { name: key, count: 0, totalReceived: 0, totalSettled: 0, remaining: 0 };
      map[key].count += 1;
      map[key].totalReceived += Number(c.amount) || 0;
      map[key].totalSettled += settled;
      map[key].remaining += remaining;
    });
    return Object.values(map).sort((a, b) => b.remaining - a.remaining);
  }, [custodies]);

  return (
    <div>
      <div style={cardStyle}>
        <div style={cardTitle}>📊 ملخّص عام</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>

            <div style={{ fontSize: 20, fontWeight: 800, color: "#fff" }}>{fmt(grandTotal)}</div>
          </div>
          <div style={{ flex: "1 1 200px", background: C.blueSoft, border: "1px solid " + C.border, borderRadius: 10, padding: "12px 14px" }}>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>إجمالي عهد قائمة (لسه ما اتسددتش)</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: outstandingCustody > 0 ? C.danger : C.success }}>{fmt(outstandingCustody)}</div>

        </div>
      </div>

      {employeeSummary.length > 0 && (
        <div style={cardStyle}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }} className="no-print">
            <div style={{ ...cardTitle, marginBottom: 0, border: "none", padding: 0 }}>🧍 ملخّص عهد الموظفين — نظرة سريعة</div>
            <button onClick={() => window.print()} style={ghostBtn}>🖨️ طباعة الملخّص</button>
          </div>
          <div className="print-only-header"><h2>ملخّص عهد الموظفين</h2></div>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }} className="no-print">كل موظف عنده عهدة/سلفة، كم استلم إجمالًا وكم متبقي عليه — من غير ما تحتاج تفتح تفاصيله لوحده.</div>
          <div style={{ overflowX: "auto" }}>
            <table style={tblStyle}>

                  const phone = findUserPhoneByName(users, e.name);
                  const link = e.remaining > 0 && phone ? whatsappLink(phone, `مرحبًا ${e.name}،\nتذكير بخصوص العهدة/السلفة القائمة عليك بمبلغ ${fmt(e.remaining)} ر.س.\nالرجاء المبادرة بالتسوية أو تسجيل مصروفاتها في التطبيق.\nشكرًا لك.`) : null;
